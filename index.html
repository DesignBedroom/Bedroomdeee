const RATE_PER_KG = 8;
const RATE_PER_KM = 15;
const BASE_FEE = 50;
const FUEL_PER_KM = 6;
const DRIVER_WAGE = 150;

function calcShipping(weight, distance){ return Math.round(BASE_FEE + weight*RATE_PER_KG + distance*RATE_PER_KM); }
function calcTripCost(distance){ return Math.round(distance*FUEL_PER_KM + DRIVER_WAGE); }
function fmt(n){ return Number(n).toLocaleString('th-TH'); }
function findProduct(id){ return db.products.find(p=>p.id===id); }

  db.notifications.unshift({id:'N'+Date.now()+Math.random().toString(16).slice(2,5), text, channels, time:nowLabel()});

}
function nowLabel(){
  const d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function buildOrder(customerId, items){
  const customer = findCustomer(customerId);
  const distance = customer.distance;
  const totalWeight = items.reduce((s,i)=>s+findProduct(i.productId).weight*i.qty,0);
  const productTotal = items.reduce((s,i)=>s+findProduct(i.productId).price*i.qty,0);
  const shippingCost = calcShipping(totalWeight, distance);
  const co2 = Math.round(distance*CO2_FACTOR_KG_PER_KM*10)/10;
  const id = 'O'+(1000+db.orders.length+1);
  const order = {
    id, customerId, items, totalWeight, distance,
    shippingCost, productTotal, grandTotal: productTotal+shippingCost,
    co2, status:'new', driverId:null,
    timeline:[{status:'new', time:nowLabel()}]
  };
  db.orders.unshift(order);
  addNotification(`ออเดอร์ #${id} ถูกสร้างขึ้นใหม่ (ลูกค้า: ${customer.name})`, ['inapp']);
  return order;
}

function matchStylePreset(text){
  const t = (text||'').toLowerCase();
  let best = null, bestScore = 0;
  STYLE_PRESETS.forEach(p=>{
    let score = 0;
    p.keywords.forEach(k=>{ if(t.includes(k.toLowerCase())) score++; });
    if(score>bestScore){ bestScore=score; best=p; }
  });
  return best || STYLE_PRESETS[0];
}

/* Smart Route Optimization — nearest-neighbor heuristic */
function nearestNeighborRoute(stops){
  const remaining = stops.slice();
  const route = [];
  let current = DEPOT;
  let totalDist = 0;
  while(remaining.length){
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((s,idx)=>{
      const d = Math.hypot(s.x-current.x, s.y-current.y);
      if(d<bestDist){ bestDist=d; bestIdx=idx; }
    });
    const next = remaining.splice(bestIdx,1)[0];
    totalDist += bestDist;
    route.push(next);
    current = next;
  }
  totalDist += Math.hypot(current.x-DEPOT.x, current.y-DEPOT.y);
  return {route, totalDist};
}
function naiveRouteDistance(stops){
  let current = DEPOT, total = 0;
  stops.forEach(s=>{ total += Math.hypot(s.x-current.x, s.y-current.y); current = s; });
  total += Math.hypot(current.x-DEPOT.x, current.y-DEPOT.y);
  return total;
}
function driverActiveStops(driverId){
  const activeOrders = db.orders.filter(o=>o.driverId===driverId && (o.status==='pending'||o.status==='in_transit'));
  const map = {};
  activeOrders.forEach(o=>{
    const c = findCustomer(o.customerId);
    const cx = c.coord ? c.coord.x : 0, cy = c.coord ? c.coord.y : 0;
    if(!map[c.id]) map[c.id] = {id:c.id, name:c.name, x:cx, y:cy, orders:[]};
    map[c.id].orders.push(o.id);
  });
  return Object.values(map);
}
function computeFleetCO2Savings(){
  let totalSavedKm = 0;
  db.drivers.forEach(d=>{
    const stops = driverActiveStops(d.id);
    if(stops.length>=2){
      const naive = naiveRouteDistance(stops);
      const {totalDist} = nearestNeighborRoute(stops);
      totalSavedKm += Math.max(0, naive-totalDist);
    }
  });
  return totalSavedKm*CO2_FACTOR_KG_PER_KM;
}
function renderRouteMapSVG(routeStops){
  const allPoints = [DEPOT, ...routeStops];
  const xs = allPoints.map(p=>p.x), ys = allPoints.map(p=>p.y);
  const minX = Math.min(...xs)-4, maxX = Math.max(...xs)+4;
  const minY = Math.min(...ys)-4, maxY = Math.max(...ys)+4;
  const w=300, h=220;
  const sx = x => ((x-minX)/(maxX-minX))*w;
  const sy = y => h-((y-minY)/(maxY-minY))*h;
  let path = `M ${sx(DEPOT.x)} ${sy(DEPOT.y)} `;
  routeStops.forEach(s=>{ path += `L ${sx(s.x)} ${sy(s.y)} `; });
  path += `L ${sx(DEPOT.x)} ${sy(DEPOT.y)}`;
  const dots = routeStops.map((s,idx)=>`
    <circle cx="${sx(s.x)}" cy="${sy(s.y)}" r="11" fill="var(--accent)"></circle>
    <text x="${sx(s.x)}" y="${sy(s.y)+4}" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">${idx+1}</text>
    <text x="${sx(s.x)}" y="${sy(s.y)+24}" font-size="9" fill="#6E6656" text-anchor="middle">${s.name}</text>
  `).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-auto">
    <path d="${path}" fill="none" stroke="#2E4A3A" stroke-width="2" stroke-dasharray="5,4"></path>
    <circle cx="${sx(DEPOT.x)}" cy="${sy(DEPOT.y)}" r="10" fill="#2E4A3A"></circle>
    <text x="${sx(DEPOT.x)}" y="${sy(DEPOT.y)+4}" font-size="11" fill="#fff" text-anchor="middle">🏭</text>
    ${dots}
  </svg>`;
}

function toast(msg, type='default'){
  const root = document.getElementById('toast-root');
  const colors = {default:'bg-[var(--ink)]', success:'bg-[var(--success)]', warn:'bg-[var(--warn)]', danger:'bg-[var(--danger)]'};
  const el = document.createElement('div');
  el.className = `toast pointer-events-auto ${colors[type]||colors.default} text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg max-w-[90%] text-center`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);
}

let three = { renderer:null, scene:null, camera:null, raf:null, target:null, spherical:{r:9,theta:0.8,phi:1.1}, dragging:false, lastX:0, lastY:0, itemsGroup:null, _onMove:null, _onUp:null };

function initThree(){
  stopThree();
  const canvas = document.getElementById('three-canvas');
  if(!canvas) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xEFE7D6);

  const room = 6;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(room,room), new THREE.MeshStandardMaterial({color:0xD9CBAE}));
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);
  const grid = new THREE.GridHelper(room, 12, 0xB8A67F, 0xCDBE9C);
  scene.add(grid);

  const wallMat = new THREE.MeshStandardMaterial({color:0xF3ECDD, side:THREE.DoubleSide, transparent:true, opacity:0.55});
  const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(room,2.6), wallMat);
  wallBack.position.set(0,1.3,-room/2);
  scene.add(wallBack);
  const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(room,2.6), wallMat);
  wallLeft.position.set(-room/2,1.3,0);
  wallLeft.rotation.y = Math.PI/2;
  scene.add(wallLeft);

  const light1 = new THREE.HemisphereLight(0xffffff, 0x554433, 1.0);
  scene.add(light1);
  const light2 = new THREE.DirectionalLight(0xffffff, 0.6);
  light2.position.set(4,6,3);
  scene.add(light2);

  const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
  const target = new THREE.Vector3(0,0.4,0);

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

  three.renderer = renderer; three.scene = scene; three.camera = camera; three.target = target;
  three.itemsGroup = new THREE.Group();
  scene.add(three.itemsGroup);

  updateCamera();
  rebuildRoomItems();

  const onDown = (x,y)=>{ three.dragging=true; three.lastX=x; three.lastY=y; };
  const onMove = (x,y)=>{
    if(!three.dragging) return;
    const dx = x-three.lastX, dy = y-three.lastY;
    three.spherical.theta -= dx*0.006;
    three.spherical.phi = Math.min(1.45, Math.max(0.3, three.spherical.phi - dy*0.006));
    three.lastX=x; three.lastY=y;
    updateCamera();
  };
  const onUp = ()=>{ three.dragging=false; };

  canvas.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', e=>{const t=e.touches[0]; onDown(t.clientX,t.clientY);}, {passive:true});
  canvas.addEventListener('touchmove', e=>{const t=e.touches[0]; onMove(t.clientX,t.clientY);}, {passive:true});
  canvas.addEventListener('touchend', onUp);
  three._onMove = onMove; three._onUp = onUp;

  function loop(){
    three.raf = requestAnimationFrame(loop);
    renderer.render(scene, camera);
  }
  loop();
  renderPlacedList();
}
function updateCamera(){
  const s = three.spherical;
  const x = s.r * Math.sin(s.phi) * Math.sin(s.theta);
  const y = s.r * Math.cos(s.phi);
  const z = s.r * Math.sin(s.phi) * Math.cos(s.theta);
  three.camera.position.set(x,y,z);
  three.camera.lookAt(three.target);
}
function stopThree(){
  if(three.raf) cancelAnimationFrame(three.raf);
  if(three._onMove) window.removeEventListener('mousemove', three._onMove);
  if(three._onUp) window.removeEventListener('mouseup', three._onUp);
  three.raf=null; three.renderer=null; three.scene=null; three._onMove=null; three._onUp=null;
}
function addToRoom(productId){
  const p = findProduct(productId);
  state.designer.placed.push({productId, uid: 'it'+Date.now()+Math.random().toString(16).slice(2,4)});
  toast(`วาง "${p.name}" ในห้องแล้ว`,'success');
  rebuildRoomItems();
  renderPlacedList();
}
function removeFromRoom(uid){
  state.designer.placed = state.designer.placed.filter(i=>i.uid!==uid);
  rebuildRoomItems();
  renderPlacedList();
}
function rebuildRoomItems(){
  if(!three.itemsGroup) return;
  three.itemsGroup.clear();
  const cols = 4, spacing = 1.15, startX = -((Math.min(cols,state.designer.placed.length)-1)*spacing)/2;
  state.designer.placed.forEach((item,idx)=>{
    const p = findProduct(item.productId);
    const [dx,dy,dz] = p.dims;
    const geo = new THREE.BoxGeometry(dx,dy,dz);
    const mat = new THREE.MeshStandardMaterial({color:p.color});
    const mesh = new THREE.Mesh(geo,mat);
    const col = idx % cols, row = Math.floor(idx/cols);
    mesh.position.set(startX + col*spacing, dy/2, -1 + row*1.2);
    three.itemsGroup.add(mesh);
  });
}
function renderPlacedList(){
  const listEl = document.getElementById('placed-list');
  const countEl = document.getElementById('placed-count');
  const weightEl = document.getElementById('placed-weight');
  if(!listEl) return;
  const placed = state.designer.placed;
  countEl.textContent = placed.length;
  const totalWeight = placed.reduce((s,i)=>s+findProduct(i.productId).weight,0);
  weightEl.textContent = totalWeight + ' กก.';
  listEl.innerHTML = placed.length===0
    ? `<p class="text-sm text-[var(--ink-soft)] text-center py-6">แตะเฟอร์นิเจอร์ด้านบนเพื่อเริ่มจัดวาง</p>`

      return `<div class="card p-2.5 flex items-center justify-between">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg shrink-0" style="background:var(--accent-soft)">🪑</div>
          <div class="min-w-0"><div class="text-[13px] font-medium truncate">${p.name}</div><div class="text-[11px] text-[var(--ink-soft)]">${p.weight} กก. · ฿${fmt(p.price)}</div></div>
        </div>
        <button onclick="removeFromRoom('${item.uid}')" class="text-[var(--danger)] text-lg px-2">✕</button>
      </div>`;
    }).join('');

/* =========================================================
   AR: CAMERA-BASED FURNITURE PLACEMENT (WebXR + fallback)
========================================================= */
let arState = { productIds:[], renderer:null, scene:null, camera:null, group:null, raf:null, stream:null, xrSession:null, dragging:false, lastX:0, lastY:0, _onMove:null, _onUp:null };

function openARView(productIds){
  if(!productIds || productIds.length===0){ toast('กรุณาเลือกเฟอร์นิเจอร์ก่อนดู AR','warn'); return; }
  arState.productIds = productIds;
  const overlay = document.getElementById('ar-overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = arOverlayHTML();
  startAR();
}
function closeAR(){
  stopAR();
  const overlay = document.getElementById('ar-overlay');
  overlay.classList.add('hidden');
  overlay.innerHTML='';
}
function arOverlayHTML(){
  const names = arState.productIds.map(id=>findProduct(id).name).join(', ');
  return `
  <div class="absolute inset-0 bg-black">
    <video id="ar-video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
    <canvas id="ar-canvas" class="absolute inset-0 w-full h-full"></canvas>
    <div class="absolute top-0 left-0 right-0 flex items-center justify-between p-4">
      <button onclick="closeAR()" class="w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center text-lg">✕</button>
      <div id="ar-mode-badge" class="chip bg-black/50 text-white">กำลังเปิดกล้อง...</div>
    </div>
    <div class="absolute bottom-0 left-0 right-0 p-4 space-y-2.5">
      <div class="bg-black/55 rounded-2xl p-3 text-white text-[12px] leading-relaxed" id="ar-hint">
        กำลังแสดง: ${names} · ลากบนหน้าจอเพื่อขยับตำแหน่ง
      </div>
      <div class="flex items-center gap-3 bg-black/55 rounded-2xl p-3">
        <span class="text-white text-xs w-14 shrink-0">หมุน</span>
        <input id="ar-rotate" type="range" min="0" max="360" value="0" class="flex-1" oninput="arSetRotation(this.value)">
      </div>
      <div class="flex items-center gap-3 bg-black/55 rounded-2xl p-3">
        <span class="text-white text-xs w-14 shrink-0">ขนาด</span>
        <input id="ar-scale" type="range" min="50" max="150" value="100" class="flex-1" oninput="arSetScale(this.value)">
      </div>
    </div>
  </div>`;
}
function buildARFurnitureGroup(){
  const group = new THREE.Group();
  const n = arState.productIds.length;
  const cols = 3, spacing = 0.9;
  const startX = -((Math.min(cols,n)-1)*spacing)/2;
  arState.productIds.forEach((id,idx)=>{
    const p = findProduct(id);
    const [dx,dy,dz] = p.dims;
    const geo = new THREE.BoxGeometry(dx,dy,dz);
    const mat = new THREE.MeshStandardMaterial({color:p.color});
    const mesh = new THREE.Mesh(geo,mat);
    const col = idx % cols, row = Math.floor(idx/cols);
    mesh.position.set(startX+col*spacing, dy/2, -row*0.9);
    group.add(mesh);
  });
  return group;
}
async function startAR(){
  if(navigator.xr){
    try{
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if(supported){ await startWebXR(); return; }
    }catch(e){ /* fall through to camera fallback */ }
  }
  await startCameraFallback();
}
async function startWebXR(){
  const badge = document.getElementById('ar-mode-badge');
  if(badge) badge.textContent = 'โหมด AR เต็มรูปแบบ';
  const video = document.getElementById('ar-video');
  if(video) video.style.display = 'none';
  const canvas = document.getElementById('ar-canvas');
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.xr.enabled = true;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();
  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(light);

  const group = buildARFurnitureGroup();
  group.position.set(0,0,-1.4);
  scene.add(group);
  arState.group = group; arState.renderer = renderer; arState.scene = scene; arState.camera = camera;

  try{
    const session = await navigator.xr.requestSession('immersive-ar', {optionalFeatures:['dom-overlay','local-floor'], domOverlay:{root:document.getElementById('ar-overlay')}});
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    arState.xrSession = session;
    session.addEventListener('end', ()=>{ arState.xrSession=null; });
    session.addEventListener('select', ()=>{
      const dir = new THREE.Vector3(0,0,-1.4).applyQuaternion(camera.quaternion);
      group.position.copy(camera.position).add(dir);
    });
    renderer.setAnimationLoop(()=>{ renderer.render(scene, camera); });
    const hint = document.getElementById('ar-hint');
    if(hint) hint.textContent += ' · แตะหน้าจอเพื่อวางเฟอร์นิเจอร์ตรงหน้าคุณ';
  }catch(e){
    await startCameraFallback();
  }
}
async function startCameraFallback(){
  const badge = document.getElementById('ar-mode-badge');
  if(badge) badge.textContent = 'โหมดกล้อง (พรีวิว)';
  const video = document.getElementById('ar-video');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    video.srcObject = stream;
    arState.stream = stream;
  }catch(e){
    const hint = document.getElementById('ar-hint');
    if(hint) hint.textContent = 'ไม่สามารถเข้าถึงกล้องได้ (ต้องเปิดผ่าน HTTPS หรือ localhost และอนุญาตสิทธิ์กล้อง) — แสดงพื้นหลังจำลองแทน';
    if(video) video.style.display='none';
  }
  const canvas = document.getElementById('ar-canvas');
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  const w = canvas.clientWidth || 400, h = canvas.clientHeight || 700;
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, w/h, 0.1, 50);
  camera.position.set(0,1.2,3);
  camera.lookAt(0,0.5,0);
  const light = new THREE.HemisphereLight(0xffffff,0x444444,1.3);
  scene.add(light);
  const group = buildARFurnitureGroup();
  group.position.set(0,0,0);
  scene.add(group);
  arState.group = group; arState.renderer = renderer; arState.scene = scene; arState.camera = camera;

  const onDown = (x,y)=>{ arState.dragging=true; arState.lastX=x; arState.lastY=y; };
  const onMoveFn = (x,y)=>{
    if(!arState.dragging) return;
    const dx=(x-arState.lastX)/w, dy=(y-arState.lastY)/h;
    group.position.x += dx*4;
    group.position.z += dy*4;
    arState.lastX=x; arState.lastY=y;
  };
  const onUpFn = ()=>{ arState.dragging=false; };
  canvas.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>onMoveFn(e.clientX,e.clientY));
  window.addEventListener('mouseup', onUpFn);
  canvas.addEventListener('touchstart', e=>{const t=e.touches[0]; onDown(t.clientX,t.clientY);}, {passive:true});
  canvas.addEventListener('touchmove', e=>{const t=e.touches[0]; onMoveFn(t.clientX,t.clientY);}, {passive:true});
  canvas.addEventListener('touchend', onUpFn);
  arState._onMove = onMoveFn; arState._onUp = onUpFn;

  function loop(){ arState.raf = requestAnimationFrame(loop); renderer.render(scene,camera); }
  loop();
}
function arSetRotation(val){ if(arState.group) arState.group.rotation.y = (val/180)*Math.PI; }
function arSetScale(val){ if(arState.group){ const s = val/100; arState.group.scale.set(s,s,s); } }
function stopAR(){
  if(arState.raf) cancelAnimationFrame(arState.raf);
  if(arState.stream) arState.stream.getTracks().forEach(t=>t.stop());
  if(arState.xrSession){ try{ arState.xrSession.end(); }catch(e){} }
  if(arState.renderer){ try{ arState.renderer.setAnimationLoop(null); }catch(e){} }
  if(arState._onMove) window.removeEventListener('mousemove', arState._onMove);
  if(arState._onUp) window.removeEventListener('mouseup', arState._onUp);
  arState = { productIds:[], renderer:null, scene:null, camera:null, group:null, raf:null, stream:null, xrSession:null, dragging:false, lastX:0, lastY:0, _onMove:null, _onUp:null };
}

function saveProduct(productId){
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-cat').value.trim() || 'ทั่วไป';
  const price = Number(document.getElementById('f-price').value)||0;
  const weight = Number(document.getElementById('f-weight').value)||0;
  const stock = Number(document.getElementById('f-stock').value)||0;
  const recycledPct = Math.max(0, Math.min(100, Number(document.getElementById('f-recycled').value)||0));
  const material = document.getElementById('f-material').value.trim();
  if(!name){ toast('กรุณากรอกชื่อสินค้า','warn'); return; }
  if(productId){
    const p = findProduct(productId);
    Object.assign(p,{name,category,price,weight,stock,recycledPct,material});
    toast('บันทึกการแก้ไขแล้ว','success');
  } else {
    db.products.push({id:'P'+Date.now(), name, category, price, weight, stock, color:0x8B5E34, dims:[1,0.8,0.6], recycledPct, material});
    toast('เพิ่มสินค้าใหม่แล้ว','success');
  }
  closeModal(); render();
}
function deleteProduct(productId){
  db.products = db.products.filter(p=>p.id!==productId);
  closeModal(); render();
  toast('ลบสินค้าแล้ว');
}

    <div class="mb-4">
      <label class="text-[12px] text-[var(--ink-soft)]">มอบหมายคนขับ</label>
      <select onchange="assignDriver('${o.id}', this.value)" class="w-full mt-1 border border-[var(--line)] rounded-xl px-3 py-2.5 bg-white text-sm">

      </select>
    </div>

    <div>
      <label class="text-[12px] text-[var(--ink-soft)] mb-1.5 block">อัปเดตสถานะ</label>

      </div>
    </div>
  `);
}
function assignDriver(orderId, driverId){
  const o = db.orders.find(x=>x.id===orderId);
  o.driverId = driverId || null;
  if(driverId && o.status==='new'){ o.status='pending'; o.timeline.push({status:'pending',time:nowLabel()}); }
  addNotification(`ออเดอร์ #${o.id} มอบหมายให้คนขับ ${driverId?findDriver(driverId).name:'-'}`, ['inapp']);
  toast('อัปเดตการมอบหมายงานแล้ว','success');
  closeModal(); render();
}
function setOrderStatus(orderId, status){
  const o = db.orders.find(x=>x.id===orderId);
  if(o.status===status) return;
  o.status = status;
  o.timeline.push({status, time:nowLabel()});
  const meta = STATUS_META[status];
  addNotification(`ออเดอร์ #${o.id} เปลี่ยนสถานะเป็น "${meta.label}"`, status==='delivered'||status==='failed' ? ['line','email'] : ['inapp']);
  toast(`อัปเดตสถานะเป็น "${meta.label}"`,'success');
  closeModal(); render();
}

/* =========================================================
   ADMIN: SMART ROUTE OPTIMIZATION
========================================================= */
function renderRoutesAdmin(){
  const driverId = state.routeDriverId || db.drivers[0].id;
  const stops = driverActiveStops(driverId);

  let body;
  if(stops.length===0){
    body = `<div class="text-center py-16 text-[var(--ink-soft)]">คนขับคนนี้ยังไม่มีงานที่ต้องจัดเส้นทาง</div>`;
  } else if(stops.length===1){
    body = `
    <div class="card p-3 mb-4">${renderRouteMapSVG(stops)}</div>
    <p class="text-sm text-[var(--ink-soft)] text-center">มีจุดส่งเดียว ไม่จำเป็นต้องจัดลำดับเส้นทาง</p>`;
  } else {
    const naive = naiveRouteDistance(stops);
    const {route, totalDist} = nearestNeighborRoute(stops);
    const savedKm = Math.max(0, naive-totalDist);
    const savedCO2 = savedKm*CO2_FACTOR_KG_PER_KM;
    body = `
    <div class="card p-3 mb-4">${renderRouteMapSVG(route)}</div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="card p-3"><div class="text-[11px] text-[var(--ink-soft)]">ระยะทางหลังปรับเส้นทาง</div><div class="font-display font-semibold text-xl">${totalDist.toFixed(1)} กม.</div></div>
      <div class="card p-3"><div class="text-[11px] text-[var(--ink-soft)]">ประหยัดระยะทางได้</div><div class="font-display font-semibold text-xl" style="color:var(--success)">${savedKm.toFixed(1)} กม.</div></div>
      <div class="card p-3 col-span-2" style="background:var(--success-soft)"><div class="text-[11px]" style="color:var(--success)">ลดการปล่อย CO₂ เทียบกับลำดับเดิม</div><div class="font-display font-semibold text-xl" style="color:var(--success)">${savedCO2.toFixed(1)} กก. CO₂</div></div>
    </div>
    <div class="font-display font-semibold text-sm mb-2">ลำดับจุดส่งที่แนะนำ</div>
    <div class="space-y-2">
    ${route.map((s,idx)=>`
      <div class="card p-3 flex items-center gap-3">
        <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold text-white shrink-0" style="background:var(--accent)">${idx+1}</div>
        <div class="flex-1 min-w-0"><div class="text-[13px] font-medium truncate">${s.name}</div><div class="text-[11px] text-[var(--ink-soft)]">ออเดอร์ ${s.orders.map(o=>'#'+o).join(', ')}</div></div>
      </div>`).join('')}
    </div>`;
  }

  return `
  <div class="px-4 pt-4 pb-6">
    <div class="card p-3 mb-4 flex items-center justify-between">
      <div class="text-[11px] text-[var(--ink-soft)]">จัดเส้นทางให้คนขับ</div>
      <select onchange="state.routeDriverId=this.value;render()" class="text-sm border border-[var(--line)] rounded-lg px-2 py-1.5 bg-white">
        ${db.drivers.map(d=>`<option value="${d.id}" ${d.id===driverId?'selected':''}>${d.name}</option>`).join('')}
      </select>
    </div>
    ${body}
  </div>`;
}

function renderDriverRoutePanel(driverId){
  const stops = driverActiveStops(driverId);
  if(stops.length<2) return '';
  const naive = naiveRouteDistance(stops);
  const {route, totalDist} = nearestNeighborRoute(stops);
  const savedKm = Math.max(0, naive-totalDist);
  return `
  <div class="card p-3.5 mx-4 mb-3">
    <div class="font-display font-semibold text-sm mb-1.5">เส้นทางแนะนำวันนี้ · ประหยัด ${savedKm.toFixed(1)} กม.</div>
    <div class="flex flex-wrap gap-1.5">
      ${route.map((s,idx)=>`<span class="chip" style="background:var(--accent-soft);color:var(--accent)">${idx+1}. ${s.name}</span>`).join('')}
    </div>
  </div>`;
}
function renderDriverJobs(){
  const jobs = db.orders.filter(o=>o.driverId===state.driverIdView && (o.status==='pending'||o.status==='in_transit'));
  return `
  ${driverSelector()}
  ${renderDriverRoutePanel(state.driverIdView)}
  <div class="px-4 pb-6">
    ${jobs.length===0?`<div class="text-center py-16 text-[var(--ink-soft)]">ยังไม่มีงานที่ต้องดำเนินการ</div>`:
    jobs.map(o=>driverJobCard(o)).join('')}
  </div>`;
}
function renderDriverHistory(){
  const jobs = db.orders.filter(o=>o.driverId===state.driverIdView && (o.status==='delivered'||o.status==='failed'));
  return `
  ${driverSelector()}
  <div class="px-4 pb-6">
    ${jobs.length===0?`<div class="text-center py-16 text-[var(--ink-soft)]">ยังไม่มีประวัติงาน</div>`:
    jobs.map(o=>driverJobCard(o)).join('')}
  </div>`;
}
function driverJobCard(o){
  const meta = STATUS_META[o.status];
  const customer = findCustomer(o.customerId);
  return `
  <button onclick="openDriverJobDetail('${o.id}')" class="card w-full text-left p-3.5 mb-2.5 block">
    <div class="flex items-center justify-between mb-1">
      <span class="font-semibold text-sm">#${o.id}</span>
      <span class="chip" style="background:${meta.soft};color:${meta.color}">${meta.label}</span>
    </div>
    <div class="text-[12.5px] text-[var(--ink-soft)]">${customer.name} · ${customer.address}</div>
    <div class="text-[11.5px] text-[var(--ink-soft)] mt-0.5">น้ำหนัก ${o.totalWeight} กก. · ${o.distance} กม.</div>
  </button>`;
}
function openDriverJobDetail(orderId){
  const o = db.orders.find(x=>x.id===orderId);
  const customer = findCustomer(o.customerId);
  let actionBtns = '';
  if(o.status==='pending') actionBtns = `<button onclick="driverSetStatus('${o.id}','in_transit')" class="w-full btn-primary rounded-2xl py-3 font-semibold">เริ่มเดินทางไปส่งสินค้า</button>`;
  else if(o.status==='in_transit') actionBtns = `
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="driverSetStatus('${o.id}','delivered')" class="rounded-2xl py-3 font-semibold" style="background:var(--success);color:#fff">ส่งสำเร็จ</button>
      <button onclick="driverSetStatus('${o.id}','failed')" class="rounded-2xl py-3 font-semibold" style="background:var(--danger-soft);color:var(--danger)">ส่งไม่สำเร็จ</button>
    </div>`;
  openModal(`
    <h3 class="font-display font-semibold text-lg mb-0.5">งานจัดส่ง #${o.id}</h3>
    <p class="text-sm text-[var(--ink-soft)] mb-4">${customer.name} · ${customer.phone}</p>
    <div class="card p-3.5 space-y-1.5 mb-4">
      <div class="text-sm"><span class="text-[var(--ink-soft)]">ที่อยู่:</span> ${customer.address}</div>
      <div class="text-sm"><span class="text-[var(--ink-soft)]">ระยะทาง:</span> ${o.distance} กม.</div>
      <div class="h-px bg-[var(--line)] my-1.5"></div>
      ${o.items.map(i=>`<div class="flex justify-between text-sm"><span>${findProduct(i.productId).name} × ${i.qty}</span></div>`).join('')}
      <div class="flex justify-between text-sm font-medium mt-1"><span>น้ำหนักรวม</span><span>${o.totalWeight} กก.</span></div>
    </div>
    ${actionBtns}
  `);
}
function driverSetStatus(orderId, status){
  setOrderStatus(orderId, status);
}

/* =========================================================
   INIT
========================================================= */
render();
</script>
</body>
</html>
