<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Room Studio</title>
<style>
:root{--bg:#0f1116;--panel:#181b23;--panel2:#222632;--line:#2e3340;--text:#eef0f4;
      --sub:#98a0b0;--accent:#5b8cff;--warn:#ffb454;--danger:#ff6161;
      --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
.card{background:rgba(24,27,35,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:14px;}

#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:8px;align-items:center;
  padding:calc(8px + var(--sat)) 12px 8px;pointer-events:none;}
#bar>*{pointer-events:auto;}
#nameBox{flex:1;min-width:0;padding:9px 12px;font-weight:600;font-size:13.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;}
.iconbtn.on{background:var(--accent);border-color:var(--accent);}
#rail{position:fixed;right:12px;top:calc(58px + var(--sat));z-index:15;display:flex;flex-direction:column;gap:8px;}
#seg{position:fixed;left:12px;top:calc(58px + var(--sat));z-index:15;display:flex;padding:3px;gap:2px;}
#seg button{padding:6px 11px;border-radius:10px;font-size:12px;color:var(--sub);}
#seg button.on{background:var(--accent);color:#fff;}

#sel{position:fixed;left:0;right:0;z-index:18;display:none;justify-content:center;gap:6px;padding:0 10px;}
#sel.on{display:flex;}
#sel button{width:44px;height:44px;border-radius:13px;background:var(--panel2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:17px;}
#sel button.on{background:var(--accent);border-color:var(--accent);}
#sel button.dgr{color:var(--danger);border-color:#5a2b2b;}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:19;height:96px;
  background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.45);transition:height .26s cubic-bezier(.22,.8,.3,1);
  display:flex;flex-direction:column;padding-bottom:var(--sab);}
#sheet.drag{transition:none;}
#grab{height:22px;display:grid;place-items:center;flex:0 0 auto;touch-action:none;}
#grab::after{content:"";width:38px;height:4px;border-radius:2px;background:#454b5c;}
#tabs{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none;}
#tabs::-webkit-scrollbar{display:none;}
#tabs button{flex:0 0 auto;padding:7px 13px;border-radius:11px;font-size:12.5px;
  background:var(--panel2);color:var(--sub);border:1px solid transparent;white-space:nowrap;}
#tabs button.on{background:rgba(91,140,255,.16);color:var(--accent);border-color:var(--accent);}
#body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 12px 18px;-webkit-overflow-scrolling:touch;}
.pane{display:none;} .pane.on{display:block;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--sub);}
.chip b{font-size:22px;font-weight:400;line-height:1;}
.chip:active{transform:scale(.95);}
.chip.up{border-color:rgba(255,180,84,.45);color:var(--warn);}
.row{display:flex;align-items:center;gap:10px;margin:11px 0;}
.row label{flex:0 0 88px;font-size:12px;color:var(--sub);}
.row output{flex:0 0 58px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;}
input[type=range]{flex:1;accent-color:var(--accent);height:26px;min-width:0;}
.sect{font-size:11px;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;margin:14px 0 6px;}
.swrap{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.swrap::-webkit-scrollbar{display:none;}
.sw{flex:0 0 46px;height:46px;border-radius:12px;border:3px solid transparent;position:relative;padding:0;}
.sw.on{border-color:var(--accent);}
.sw span{position:absolute;bottom:-15px;left:-4px;right:-4px;text-align:center;font-size:9px;color:var(--sub);}
.mcat{flex:0 0 auto;padding:7px 12px;border-radius:11px;background:var(--panel2);font-size:12px;color:var(--sub);}
.mcat.on{background:rgba(91,140,255,.16);color:var(--accent);}
.btn{width:100%;padding:12px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);
  font-size:13px;margin-top:8px;}
.btn.dgr{color:var(--danger);border-color:#5a2b2b;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.empty{color:var(--sub);font-size:12.5px;text-align:center;padding:26px 10px;}

#toast{position:fixed;left:50%;top:auto;transform:translateX(-50%) translateY(-14px);z-index:80;
  padding:10px 16px;border-radius:12px;background:#2a2f3c;font-size:12.5px;opacity:0;
  transition:.25s;pointer-events:none;white-space:nowrap;bottom:calc(120px + var(--sab));}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#fps{position:fixed;left:12px;bottom:calc(104px + var(--sab));z-index:14;font-size:10px;
  color:var(--sub);font-variant-numeric:tabular-nums;pointer-events:none;}
#err{position:fixed;inset:0;z-index:99;background:#14161c;color:#ff8f8f;padding:28px 20px;
  font:12px/1.6 ui-monospace,Menlo,monospace;overflow:auto;display:none;white-space:pre-wrap;}

/* ══════════ SHOP LAYER (เพิ่มใหม่ ไม่กระทบของเดิม) ══════════ */
#shop{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;}
#shop.on{display:flex;}
#shBar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(9px + var(--sat)) 12px 9px;
  background:var(--panel);border-bottom:1px solid var(--line);}
#shBar .t{flex:1;min-width:0;font-weight:700;font-size:15px;letter-spacing:-.3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
#shBar .t i{color:var(--accent);font-style:normal;}
.shIcon{width:38px;height:38px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;position:relative;flex:0 0 auto;}
.shBadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;}
#shTabs{flex:0 0 auto;display:flex;gap:6px;padding:9px 12px;overflow-x:auto;scrollbar-width:none;
  background:var(--panel);border-bottom:1px solid var(--line);}
#shTabs::-webkit-scrollbar{display:none;}
#shTabs button{flex:0 0 auto;padding:7px 13px;border-radius:11px;font-size:12.5px;white-space:nowrap;
  background:var(--panel2);color:var(--sub);border:1px solid transparent;}
#shTabs button.on{background:rgba(91,140,255,.16);color:var(--accent);border-color:var(--accent);}
#shBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(26px + var(--sab));}

.shTools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.shIn{padding:10px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);font-size:13px;outline:none;width:100%;}
.shIn:focus{border-color:var(--accent);}
.shTools .shIn{flex:1;min-width:130px;width:auto;}
.shTools select.shIn{flex:0 0 auto;min-width:118px;}
.shCats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
.shCats::-webkit-scrollbar{display:none;}
.shCats button{flex:0 0 auto;padding:7px 12px;border-radius:20px;font-size:12px;background:var(--panel2);
  border:1px solid var(--line);color:var(--sub);white-space:nowrap;}
.shCats button.on{background:var(--accent);border-color:var(--accent);color:#fff;}

.shGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px;}
.shCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;text-align:left;padding:0;}
.shCard:active{transform:scale(.985);}
.shThumb{width:100%;aspect-ratio:1/1;background:linear-gradient(160deg,#262b36,#1b1f28);
  display:block;object-fit:cover;}
.shCard .bd{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;}
.shCard .nm{font-size:12px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;}
.shCard .mt{font-size:10px;color:var(--sub);}
.shCard .pr{font-size:14.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.shCard .op{font-size:10.5px;color:var(--sub);text-decoration:line-through;margin-left:5px;font-weight:400;}
.shTag{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:8px;font-size:9.5px;font-weight:700;}
.shTag.sale{background:var(--danger);color:#fff;}
.shTag.new{background:var(--accent);color:#fff;}
.shTag.hot{background:var(--warn);color:#2a1d05;}
.shFav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;
  background:rgba(15,17,22,.65);display:grid;place-items:center;font-size:13px;}
.shWrapRel{position:relative;}
.shStars{font-size:10px;color:var(--warn);}
.shOut{font-size:10px;color:var(--danger);font-weight:600;}

.shSect{font-size:11px;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 7px;}
.shBox{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px;}
.shBox h4{margin:0 0 9px;font-size:13px;font-weight:600;}
.shKpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:10px;margin-bottom:13px;}
.shKpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px 13px;}
.shKpi .l{font-size:10.5px;color:var(--sub);margin-bottom:5px;}
.shKpi .v{font-size:21px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;}
.shKpi .d{font-size:10px;color:var(--sub);margin-top:3px;}
.shKpi.acc .v{color:var(--accent);} .shKpi.ok .v{color:#33c98a;}
.shKpi.wn .v{color:var(--warn);} .shKpi.dg .v{color:var(--danger);}

.shLine{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;}
.shLine span:last-child{font-variant-numeric:tabular-nums;}
.shLine.sub span{color:var(--sub);font-size:11.5px;}
.shLine.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700;font-size:15.5px;}
.shLine.tot span:last-child{color:var(--accent);}

.shItem{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:9px;margin-bottom:9px;align-items:center;}
.shItem img{width:58px;height:58px;border-radius:10px;flex:0 0 auto;object-fit:cover;background:#22262f;}
.shItem .i{flex:1;min-width:0;}
.shItem .i b{font-size:12.5px;display:block;line-height:1.35;}
.shItem .i small{color:var(--sub);font-size:10.5px;}
.shQty{display:flex;align-items:center;gap:6px;margin-top:6px;}
.shQty button{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;}
.shQty b{min-width:26px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;}

.shBtn{width:100%;padding:12px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);
  font-size:13px;font-weight:500;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;}
.shBtn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.shBtn.ok{background:rgba(51,201,138,.15);border-color:#2a6f52;color:#33c98a;}
.shBtn.dgr{background:rgba(255,97,97,.1);border-color:#5a2b2b;color:var(--danger);}
.shBtn.sm{width:auto;padding:7px 12px;font-size:12px;border-radius:10px;margin:0;}
.shRow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.shTbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);}
.shTbl table{width:100%;border-collapse:collapse;font-size:12px;min-width:430px;}
.shTbl th{text-align:left;padding:9px 10px;background:var(--panel2);color:var(--sub);font-weight:500;
  font-size:10.5px;white-space:nowrap;border-bottom:1px solid var(--line);}
.shTbl td{padding:9px 10px;border-bottom:1px solid #22262f;}
.shTbl tr:last-child td{border-bottom:none;}
.shTbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}

.shPill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;}
.s-pending{background:rgba(255,180,84,.16);color:var(--warn);}
.s-paid{background:rgba(91,140,255,.18);color:var(--accent);}
.s-packing{background:rgba(167,123,255,.18);color:#a77bff;}
.s-shipping{background:rgba(84,184,255,.18);color:#54b8ff;}
.s-done{background:rgba(51,201,138,.17);color:#33c98a;}
.s-cancel{background:rgba(255,97,97,.15);color:var(--danger);}

#shModal{position:fixed;inset:0;z-index:70;background:rgba(6,8,12,.75);display:none;
  align-items:flex-end;justify-content:center;}
#shModal.on{display:flex;}
#shModalBox{width:100%;max-width:580px;max-height:93vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 14px calc(20px + var(--sab));}
@media(min-width:680px){#shModal{align-items:center;}#shModalBox{border-radius:20px;max-height:90vh;}}
.shMH{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
.shMH h3{margin:0;flex:1;font-size:16px;line-height:1.3;}
.shGal{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:11px;}
.shGal::-webkit-scrollbar{display:none;}
.shGal img{width:112px;height:112px;border-radius:13px;flex:0 0 auto;background:#22262f;object-fit:cover;
  border:1px solid var(--line);}
.shFld{margin-bottom:10px;}
.shFld label{display:block;font-size:11px;color:var(--sub);margin-bottom:5px;}
canvas.shChart{width:100%;display:block;}
.shLeg{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:9px;}
.shLeg span{font-size:10.5px;color:var(--sub);display:inline-flex;align-items:center;gap:5px;}
.shLeg i{width:9px;height:9px;border-radius:2px;display:inline-block;}
</style>

</head>
<body>
<canvas id="gl"></canvas>

<div id="bar">
  <button class="iconbtn card" id="bUndo" aria-label="ย้อนกลับ">↩</button>
  <div class="card" id="nameBox">Room Studio</div>
  <button class="iconbtn card" id="bShop" aria-label="ร้านค้า">🛍️</button>
  <button class="iconbtn card" id="bSave" aria-label="บันทึก">💾</button>
</div>

<div id="seg" class="card">
  <button data-view="3d" class="on">3D</button>
  <button data-view="top">ผัง</button>
  <button data-view="walk">เดิน</button>
</div>

<div id="rail">
  <button class="iconbtn card" id="bCam" aria-label="รีเซ็ตกล้อง">↺</button>
  <button class="iconbtn card on" id="bSnap" aria-label="สแนป">🧲</button>
  <button class="iconbtn card" id="bWall" aria-label="ซ่อนผนัง">🧱</button>
</div>

<div id="sel">
  <button id="tRotL" aria-label="หมุนซ้าย">⟲</button>
  <button id="tRotR" aria-label="หมุนขวา">⟳</button>
  <button id="tMove" aria-label="ย้าย">✋</button>
  <button id="tDup"  aria-label="ทำซ้ำ">⧉</button>
  <button id="tDel" class="dgr" aria-label="ลบ">🗑</button>
</div>

<section id="sheet">
  <div id="grab" role="button" aria-label="ลากเพื่อขยายแผง"></div>
  <nav id="tabs">
    <button data-tab="cat" class="on">🪑 แคตตาล็อก</button>
    <button data-tab="mat">🎨 วัสดุ</button>
    <button data-tab="prop">⚙️ คุณสมบัติ</button>
    <button data-tab="room">🏠 ห้อง &amp; แสง</button>
  </nav>
  <div id="body">
    <div class="pane on" id="paneCat"><div class="grid" id="catGrid"></div></div>

    <div class="pane" id="paneMat">
      <div id="matEmpty" class="empty">แตะเฟอร์นิเจอร์ในห้องเพื่อเปลี่ยนวัสดุ</div>
      <div id="matUI" hidden>
        <div class="sect">หมวดวัสดุ</div>
        <div class="swrap" id="matCats"></div>
        <div class="sect">เฉดสี</div>
        <div class="swrap" id="matSw" style="padding-bottom:22px"></div>
        <div class="sect">ปรับละเอียด</div>
        <div class="row"><label>ความหยาบ</label><input type="range" id="sRough" min="0" max="1" step="0.01" value="0.5"><output id="oRough">—</output></div>
        <div class="row"><label>ความเป็นโลหะ</label><input type="range" id="sMetal" min="0" max="1" step="0.01" value="0"><output id="oMetal">—</output></div>
      </div>
    </div>

    <div class="pane" id="paneProp">
      <div id="propEmpty" class="empty">ยังไม่ได้เลือกวัตถุ</div>
      <div id="propUI" hidden>
        <div class="sect" id="propName">—</div>
        <div class="row"><label>กว้าง (ซม.)</label><input type="range" id="sW" min="10" max="400" step="1" value="100"><output id="oW">—</output></div>
        <div class="row"><label>สูง (ซม.)</label><input type="range" id="sH" min="5" max="300" step="1" value="100"><output id="oH">—</output></div>
        <div class="row"><label>ลึก (ซม.)</label><input type="range" id="sD" min="10" max="400" step="1" value="100"><output id="oD">—</output></div>
        <div class="row"><label>หมุน (°)</label><input type="range" id="sR" min="0" max="355" step="5" value="0"><output id="oR">—</output></div>
        <button class="btn" id="bWallSnap">↘ จัดชิดผนังที่ใกล้ที่สุด</button>
        <button class="btn dgr" id="bDel2">ลบวัตถุนี้</button>
      </div>
    </div>

    <div class="pane" id="paneRoom">
      <div class="sect">ขนาดห้อง</div>
      <div class="row"><label>กว้าง (ม.)</label><input type="range" id="rW" min="2.5" max="12" step="0.1" value="5"><output id="orW">5.0</output></div>
      <div class="row"><label>ลึก (ม.)</label><input type="range" id="rD" min="2.5" max="12" step="0.1" value="4"><output id="orD">4.0</output></div>
      <div class="row"><label>สูง (ม.)</label><input type="range" id="rH" min="2.2" max="5" step="0.05" value="2.7"><output id="orH">2.70</output></div>
      <div class="sect">พื้น</div><div class="swrap" id="floorSw" style="padding-bottom:22px"></div>
      <div class="sect">ผนัง</div><div class="swrap" id="wallSw" style="padding-bottom:22px"></div>
      <div class="sect">แสง</div>
      <div class="row"><label>ช่วงเวลา</label><input type="range" id="lTime" min="6" max="19" step="0.5" value="14"><output id="olTime">14:00</output></div>
      <div class="row"><label>ความสว่าง</label><input type="range" id="lInt" min="0" max="3" step="0.05" value="1.35"><output id="olInt">1.35</output></div>
      <div class="sect">คุณภาพภาพ</div>
      <div class="swrap" id="qBtns"></div>
      <div class="two" style="margin-top:16px">
        <button class="btn" id="bLoad">เปิดไฟล์ที่บันทึก</button>
        <button class="btn dgr" id="bClear">ล้างห้อง</button>
      </div>
    </div>
  </div>
</section>

<div id="fps">—</div>
<div id="toast"></div>
<div id="err"></div>
<input type="file" id="glbInput" accept=".glb" hidden>

<!-- ══════════ SHOP OVERLAY ══════════ -->
<section id="shop">

/* error overlay — ต้องอยู่ก่อน module เพื่อจับ SyntaxError ของ module ได้ */
(function(){
  var box=document.getElementById('err');
  function show(msg){ box.style.display='block'; box.textContent+=msg+'\n\n'; }
  window.addEventListener('error',function(e){
    show('⚠ ERROR\n'+(e.message||e.type)+'\n'+(e.filename||'')+':'+(e.lineno||''));
  });
  window.addEventListener('unhandledrejection',function(e){
    show('⚠ PROMISE\n'+(e.reason&&e.reason.message?e.reason.message:e.reason));
  });
  setTimeout(function(){
    if(!window.__ROOM_OK__) show('⚠ โมดูลไม่เริ่มทำงานใน 8 วินาที\nตรวจสอบการเชื่อมต่ออินเทอร์เน็ต (โหลด three.js จาก CDN)');
  },8000);
})();

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ══════════ 0. utils ══════════ */
const qs = s => document.querySelector(s);
const toastEl = qs('#toast');
let toastTimer = 0;
function showToast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('on'), 1900);
}
const isCoarse = matchMedia('(pointer:coarse)').matches;
const clamp = THREE.MathUtils.clamp;

/* ══════════ 1. quality tiers ══════════ */
const QUALITY = {
  low : {dpr:1,   shadow:512,  shadows:false, label:'ประหยัด'},
  med : {dpr:1.5, shadow:1024, shadows:true,  label:'สมดุล'},
  high: {dpr:2,   shadow:2048, shadows:true,  label:'สวยสุด'}
};
let qualityKey = isCoarse ? 'med' : 'high';

/* ══════════ 2. renderer ══════════ */
const canvasEl = qs('#gl');
const renderer = new THREE.WebGLRenderer({canvas:canvasEl, antialias:true, powerPreference:'high-performance'});
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1116);
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
  pmrem.dispose();
}

const camera = new THREE.PerspectiveCamera(52, 1, 0.05, 200);
const orbitTarget = new THREE.Vector3(0, 1, 0);
const orbit = {r:8, theta:Math.PI*0.75, phi:1.05};

let needsRender = true;
const invalidate = () => { needsRender = true; };

canvasEl.addEventListener('webglcontextlost', e=>{ e.preventDefault(); showToast('กราฟิกหลุด กำลังกู้คืน…'); });
canvasEl.addEventListener('webglcontextrestored', ()=>{ invalidate(); showToast('กู้คืนแล้ว'); });

function viewSize(){
  const vv = window.visualViewport;
  return { w: Math.round(vv ? vv.width : innerWidth), h: Math.round(vv ? vv.height : innerHeight) };
}
function onResize(){
  const {w,h} = viewSize();
  renderer.setPixelRatio(Math.min(devicePixelRatio, QUALITY[qualityKey].dpr));
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  layoutSelBar();
  invalidate();
}
addEventListener('resize', onResize);
if(window.visualViewport) visualViewport.addEventListener('resize', onResize);

/* ══════════ 3. procedural textures ══════════ */
const canvasCache = new Map();
function makeCanvas(kind, tint){
  const key = kind + '|' + tint;
  if(canvasCache.has(key)) return canvasCache.get(key);
  const S = 256, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const x = cv.getContext('2d');
  x.fillStyle = tint; x.fillRect(0,0,S,S);

  if(kind === 'wood'){
    for(let i=0;i<80;i++){
      x.strokeStyle = 'rgba(0,0,0,'+(0.03+Math.random()*0.07).toFixed(3)+')';
      x.lineWidth = 0.5 + Math.random()*2;
      x.beginPath();
      let y = Math.random()*S; x.moveTo(0,y);
      for(let p=0;p<=S;p+=18) x.lineTo(p, y + (Math.random()-0.5)*7);
      x.stroke();
    }
  } else if(kind === 'fabric'){
    x.globalAlpha = 0.12;
    for(let p=0;p<S;p+=4){
      x.fillStyle = (p/4)%2 ? '#000' : '#fff';
      x.fillRect(p,0,2,S); x.fillRect(0,p,S,2);
    }
    x.globalAlpha = 1;
  } else if(kind === 'marble'){
    for(let i=0;i<16;i++){
      x.strokeStyle = 'rgba(0,0,0,'+(0.04+Math.random()*0.09).toFixed(3)+')';
      x.lineWidth = 0.6 + Math.random()*2.4;
      x.beginPath();
      let px = Math.random()*S, py = 0; x.moveTo(px,py);
      for(let t=0;t<10;t++){ px += (Math.random()-0.5)*46; py += S/10; x.lineTo(px,py); }
      x.stroke();
    }
  } else if(kind === 'metal'){
    for(let y=0;y<S;y+=2){
      x.fillStyle = 'rgba(255,255,255,'+(Math.random()*0.05).toFixed(3)+')';
      x.fillRect(0,y,S,1);
    }
  } else { /* stone / plaster */
    const id = x.getImageData(0,0,S,S);
    for(let i=0;i<id.data.length;i+=4){
      const n = (Math.random()-0.5)*20;
      id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n;
    }
    x.putImageData(id,0,0);
  }
  canvasCache.set(key, cv);
  return cv;
}
/* FIX: คืน CanvasTexture ตัวใหม่เสมอ → ตั้ง repeat ได้อิสระ ไม่มิวเทตของที่แชร์ */
function makeTexture(kind, tint, repeat, srgb){
  const t = new THREE.CanvasTexture(makeCanvas(kind, tint));
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = maxAniso;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;  // FIX: roughnessMap ต้อง non-color
  return t;
}

/* ══════════ 4. material library + cache ══════════ */
const MATS = {
  wood  : {oak:0xa9744f, walnut:0x5b4636, pine:0xd9c9a8, ebony:0x3a2f29},
  marble: {white:0xf2f2f0, black:0x181818, rose:0xd4a5a0, sage:0xa8b5a5},
  stone : {gray:0x8b8b8b, slate:0x5a5a5a, sand:0xc2b280, concrete:0x6b6b6b},
  metal : {steel:0xd0d0d0, gold:0xd4af37, copper:0xb87333, black:0x3a3a3a},
  fabric: {ivory:0xefe9df, charcoal:0x2f3238, denim:0x3a6ea5, olive:0x7d8471},
  glass : {clear:0xcfeaf5, tinted:0x8ecbe6, frosted:0xdddddd}
};
const MAT_TH = {wood:'ไม้', marble:'หินอ่อน', stone:'หิน', metal:'โลหะ', fabric:'ผ้า', glass:'กระจก'};
const MAT_PRESET = {
  wood:{r:0.62,m:0}, marble:{r:0.16,m:0}, stone:{r:0.85,m:0},
  metal:{r:0.22,m:1}, fabric:{r:0.93,m:0}, glass:{r:0.08,m:0}
};
const TEX_KIND = {wood:'wood', marble:'marble', stone:'stone', metal:'metal', fabric:'fabric'};

const matCache = new Map();
/* FIX B1: tier = สเกล texture ตามขนาดจริงของชิ้นงาน (แบ่งเป็นขั้น เพื่อไม่ให้ material บาน) */
function tierOf(w,h,d){ return clamp(Math.round(Math.max(w,h,d)*1.6), 1, 6); }

function getMat(type, variant, tier){
  if(!MATS[type]) type = 'wood';
  if(MATS[type][variant] === undefined) variant = Object.keys(MATS[type])[0];  // FIX: กัน undefined
  tier = tier || 1;
  const key = type + '/' + variant + '/' + tier;
  if(matCache.has(key)) return matCache.get(key);

  const hex = MATS[type][variant], p = MAT_PRESET[type];
  const base = {color:hex, roughness:p.r, metalness:p.m,
                envMapIntensity: type==='metal' ? 1.4 : 0.85};
  let mat;
  if(type === 'glass'){
    mat = new THREE.MeshPhysicalMaterial(Object.assign({}, base, {
      transmission:0.92, thickness:0.02, ior:1.45, transparent:true, opacity:1
    }));
  } else if(type === 'marble' && qualityKey === 'high'){
    mat = new THREE.MeshPhysicalMaterial(Object.assign({}, base, {clearcoat:0.45, clearcoatRoughness:0.12}));
  } else {
    mat = new THREE.MeshStandardMaterial(base);   // FIX D2: Standard เบากว่า Physical มาก
  }
  const kind = TEX_KIND[type];
  if(kind){
    const tint = '#' + hex.toString(16).padStart(6,'0');
    mat.map = makeTexture(kind, tint, tier, true);
    mat.roughnessMap = makeTexture(kind, '#888888', tier, false);
  }
  mat.userData = {type, variant, tier, cached:true};
  matCache.set(key, mat);
  return mat;
}

/* ══════════ 5. dispose helpers (FIX A6) ══════════ */
function disposeObject(root){
  root.traverse(n=>{
    if(n.geometry) n.geometry.dispose();
    if(!n.material) return;
    if(!n.userData || !n.userData.owned) return;          // ไม่แตะ material ที่แชร์จาก cache
    const list = Array.isArray(n.material) ? n.material : [n.material];
    list.forEach(m=>{
      if(!m) return;
      if(n.userData.ownTextures){
        m.map && m.map.dispose();
        m.roughnessMap && m.roughnessMap.dispose();
        m.normalMap && m.normalMap.dispose();
        m.metalnessMap && m.metalnessMap.dispose();
      }
      m.dispose();
    });
  });
}

/* ══════════ 6. lights ══════════ */
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.35);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(QUALITY[qualityKey].shadow, QUALITY[qualityKey].shadow);
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;
sunLight.shadow.radius = 3;
scene.add(sunLight);
scene.add(sunLight.target);                 // FIX: ต้อง add target เข้า scene
const fillLight = new THREE.DirectionalLight(0xbcd4ff, 0.26);
fillLight.position.set(-4,5,-3);
scene.add(fillLight);

function setSunTime(hour){
  const t = (hour - 6) / 13, a = Math.PI * t;
  sunLight.position.set(Math.cos(a)*9, Math.max(1.8, Math.sin(a)*11), 4);
  const noon = 1 - Math.abs(0.5 - t) * 1.6;
  sunLight.color.setHSL(0.085, clamp(0.55 - noon*0.4, 0.05, 0.6), 0.62);
  invalidate();
}

/* ══════════ 7. room ══════════ */
let roomW = 5, roomD = 4, roomH = 2.7;
let floorVariant = 'oak', wallVariant = 'concrete';
let hideWalls = false;
const roomGroup = new THREE.Group();
scene.add(roomGroup);
const wallPanels = [];

function buildRoom(){
  disposeObject(roomGroup);
  roomGroup.clear();
  wallPanels.length = 0;

  /* floor */
  const fHex = MATS.wood[floorVariant] !== undefined ? MATS.wood[floorVariant] : MATS.wood.oak;
  const fTint = '#' + fHex.toString(16).padStart(6,'0');
  const fMat = new THREE.MeshStandardMaterial({color:fHex, roughness:0.55, metalness:0});
  fMat.map = makeTexture('wood', fTint, Math.max(2, Math.round(Math.max(roomW,roomD)*1.1)), true);
  fMat.roughnessMap = makeTexture('wood', '#888888', Math.max(2, Math.round(Math.max(roomW,roomD)*1.1)), false);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), fMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  floor.userData = {owned:true, ownTextures:true, isRoom:true};
  roomGroup.add(floor);

  /* grid */
  const grid = new THREE.GridHelper(Math.max(roomW,roomD), Math.round(Math.max(roomW,roomD)*2), 0x3a4050, 0x272c38);
  grid.position.y = 0.003;
  grid.material.transparent = true;
  grid.material.opacity = 0.3;
  grid.userData = {owned:true, ownTextures:false};
  roomGroup.add(grid);

  /* walls */
  const wHex = MATS.stone[wallVariant] !== undefined ? MATS.stone[wallVariant] : MATS.stone.concrete;
  const wTint = '#' + wHex.toString(16).padStart(6,'0');
  const wMat = new THREE.MeshStandardMaterial({color:wHex, roughness:0.92, metalness:0});
  wMat.map = makeTexture('plaster', wTint, 3, true);

  function panel(w,h,x,y,z,ry,own){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.1), wMat);
    m.position.set(x,y,z); m.rotation.y = ry;
    m.castShadow = true; m.receiveShadow = true;
    m.userData = {owned:true, ownTextures:!!own, isRoom:true};
    return m;
  }
  function side(nx,nz,meshes){
    const g = new THREE.Group();
    meshes.forEach(m=>g.add(m));
    g.userData = {normal:new THREE.Vector3(nx,0,nz)};
    roomGroup.add(g);
    wallPanels.push(g);
  }
  const doorW = Math.min(1.2, roomW*0.3);
  side(0,-1, [panel(roomW, roomH, 0, roomH/2, -roomD/2, 0, true)]);
  side(0, 1, [
    panel((roomW-doorW)/2, roomH, -(doorW+ (roomW-doorW)/2)/2, roomH/2, roomD/2, 0, false),
    panel((roomW-doorW)/2, roomH,  (doorW+ (roomW-doorW)/2)/2, roomH/2, roomD/2, 0, false),
    panel(doorW, Math.max(0.05, roomH-2.05), 0, roomH - Math.max(0.05, roomH-2.05)/2, roomD/2, 0, false)
  ]);
  side(-1,0, [panel(roomD, roomH, -roomW/2, roomH/2, 0, Math.PI/2, false)]);
  side( 1,0, [panel(roomD, roomH,  roomW/2, roomH/2, 0, Math.PI/2, false)]);

  /* shadow frustum ตามขนาดห้อง */
  const ext = Math.max(roomW, roomD);
  sunLight.shadow.camera.left = -ext; sunLight.shadow.camera.right = ext;
  sunLight.shadow.camera.top = ext;   sunLight.shadow.camera.bottom = -ext;
  sunLight.shadow.camera.near = 0.5;  sunLight.shadow.camera.far = 40;
  sunLight.shadow.camera.updateProjectionMatrix();

  qs('#nameBox').textContent = 'ห้อง ' + roomW.toFixed(1) + ' × ' + roomD.toFixed(1) + ' × ' + roomH.toFixed(2) + ' ม.';
  invalidate();
}

/* FIX C10: ซ่อนผนังที่บังกล้อง */
const camVec = new THREE.Vector3();
function updateWallVisibility(){
  camVec.copy(camera.position).sub(orbitTarget);
  for(const g of wallPanels){
    g.visible = hideWalls ? false : (camVec.dot(g.userData.normal) < 0.2);
  }
}

/* ══════════ 8. furniture catalog ══════════ */
function mkBox(w,h,d,type,variant,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), getMat(type,variant,tierOf(w,h,d)));
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  m.userData = {t:type, v:variant, tier:tierOf(w,h,d), owned:false};
  return m;
}
function mkCyl(rt,rb,h,type,variant,x,y,z){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,18), getMat(type,variant,tierOf(rt*2,h,rb*2)));
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  m.userData = {t:type, v:variant, tier:tierOf(rt*2,h,rb*2), owned:false};
  return m;
}
function mkCone(r,h,type,variant,x,y,z){
  const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,14), getMat(type,variant,tierOf(r*2,h,r*2)));
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  m.userData = {t:type, v:variant, tier:tierOf(r*2,h,r*2), owned:false};
  return m;
}
function mkGroup(){
  const g = new THREE.Group();
  for(const p of arguments) g.add(p);
  return g;
}
function mkLegs(type,variant,pts,y,thick,h){
  return pts.map(p => mkBox(thick,h,thick,type,variant,p[0],y,p[1]));
}

/* ══════════ 9. object state ══════════ */
const items = [];
let selected = null;
let moveMode = false;
let snapEnabled = true;

const selBox = new THREE.Box3();
const selHelper = new THREE.Box3Helper(selBox, 0x5b8cff);
selHelper.visible = false;
scene.add(selHelper);

const tmpSize = new THREE.Vector3();
/* FIX C15: ขนาดจริงไม่ขึ้นกับการหมุน */
function localSize(obj){
  const ry = obj.rotation.y;
  obj.rotation.y = 0;
  obj.updateMatrixWorld(true);
  new THREE.Box3().setFromObject(obj).getSize(tmpSize);
  obj.rotation.y = ry;
  obj.updateMatrixWorld(true);
  return tmpSize.clone();
}
function footprint(obj){
  const s = localSize(obj);
  const c = Math.abs(Math.cos(obj.rotation.y)), n = Math.abs(Math.sin(obj.rotation.y));
  return {x: s.x*c + s.z*n, z: s.x*n + s.z*c, y: s.y};
}
function clampToRoom(obj){
  const f = footprint(obj);
  obj.position.x = clamp(obj.position.x, -roomW/2 + f.x/2, roomW/2 - f.x/2);
  obj.position.z = clamp(obj.position.z, -roomD/2 + f.z/2, roomD/2 - f.z/2);
  obj.position.y = 0;
}
/* FIX C9: กันซ้อนทับแบบง่าย (AABB push-out) */
function resolveOverlap(obj){
  const a = footprint(obj);
  for(const other of items){
    if(other === obj) continue;
    const b = footprint(other);
    const ox = (a.x+b.x)/2 - Math.abs(obj.position.x - other.position.x);
    const oz = (a.z+b.z)/2 - Math.abs(obj.position.z - other.position.z);
    if(ox > 0 && oz > 0){
      if(ox < oz) obj.position.x += (obj.position.x >= other.position.x ? ox : -ox);
      else        obj.position.z += (obj.position.z >= other.position.z ? oz : -oz);
      clampToRoom(obj);
    }
  }
}
function addItem(kind){
  const entry = CATALOG[kind];
  if(!entry) return;
  const obj = entry.build();
  obj.userData = {kind, label:entry.label, base:null};
  obj.userData.base = localSize(obj);
  obj.position.set((Math.random()-0.5)*roomW*0.4, 0, (Math.random()-0.5)*roomD*0.4);
  clampToRoom(obj); resolveOverlap(obj);
  scene.add(obj); items.push(obj);
  pushUndo(); selectObject(obj);
  showToast(entry.label + ' · เพิ่มแล้ว');
}
function removeItem(obj){
  const i = items.indexOf(obj);
  if(i < 0) return;
  items.splice(i,1);
  scene.remove(obj);
  disposeObject(obj);
  if(selected === obj) selectObject(null);
  pushUndo(); invalidate();
}
function selectObject(obj){
  selected = obj;
  qs('#sel').classList.toggle('on', !!obj);
  selHelper.visible = !!obj;
  if(obj){
    selBox.setFromObject(obj);
    selHelper.box.copy(selBox);
    layoutSelBar();
  } else {
    moveMode = false;
    qs('#tMove').classList.remove('on');
  }
  refreshMaterialPanel();
  refreshPropsPanel();
  invalidate();
}
function refreshSelection(){
  if(!selected) return;
  selBox.setFromObject(selected);
  selHelper.box.copy(selBox);
  refreshPropsPanel();
  invalidate();
}
function layoutSelBar(){
  const h = qs('#sheet').getBoundingClientRect().height;
  qs('#sel').style.bottom = (h + 12) + 'px';
  qs('#fps').style.bottom = (h + 10) + 'px';
  qs('#toast').style.bottom = (h + 62) + 'px';
}

/* ══════════ 10. undo ══════════ */
const undoStack = [];
let undoLock = false;
function takeSnapshot(){
  return items.filter(o=>CATALOG[o.userData.kind]).map(o=>({
    k: o.userData.kind,
    p: o.position.toArray(),
    r: o.rotation.y,
    s: o.scale.toArray(),
    m: o.children.map(c => (c.isMesh && c.userData.t) ? [c.userData.t, c.userData.v, c.userData.tier] : null)
  }));
}
function pushUndo(){
  if(undoLock) return;
  undoStack.push(takeSnapshot());
  if(undoStack.length > 30) undoStack.shift();
}
function restoreSnapshot(state){
  undoLock = true;
  items.slice().forEach(o=>{ scene.remove(o); disposeObject(o); });
  items.length = 0;
  state.forEach(s=>{
    const entry = CATALOG[s.k];
    if(!entry) return;
    const o = entry.build();
    o.userData = {kind:s.k, label:entry.label, base:null};
    o.userData.base = localSize(o);
    o.position.fromArray(s.p);
    o.rotation.y = s.r;
    o.scale.fromArray(s.s);
    s.m.forEach((mm,i)=>{
      const c = o.children[i];
      if(mm && c && c.isMesh){
        c.material = getMat(mm[0], mm[1], mm[2]);
        c.userData = {t:mm[0], v:mm[1], tier:mm[2], owned:false};
      }
    });
    scene.add(o); items.push(o);
  });
  undoLock = false;
  selectObject(null);
  invalidate();
}

/* ══════════ 11. input ══════════ */
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const pointers = new Map();
let pressTime = 0, pressX = 0, pressY = 0;
let pinchDist = 0, pinchCX = 0, pinchCY = 0;
let dragTarget = null;
const hitPoint = new THREE.Vector3();
const dragOffset = new THREE.Vector3();
const UP = new THREE.Vector3(0,1,0);
const fwdVec = new THREE.Vector3(), rightVec = new THREE.Vector3();

function toNDC(x,y){
  const {w,h} = viewSize();
  return new THREE.Vector2((x/w)*2 - 1, -(y/h)*2 + 1);
}
/* FIX A9: raycast เฉพาะเฟอร์นิเจอร์ แล้วไต่ขึ้นหา root */
function pickItem(x,y){
  if(!items.length) return null;
  raycaster.setFromCamera(toNDC(x,y), camera);
  const hits = raycaster.intersectObjects(items, true);
  if(!hits.length) return null;
  let n = hits[0].object;
  while(n && items.indexOf(n) === -1) n = n.parent;
  return n || null;
}
function phiRange(){
  return viewMode === 'walk' ? [0.35, 2.55] : [0.12, Math.PI/2 - 0.04];
}

canvasEl.addEventListener('pointerdown', e=>{
  canvasEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){
    pressTime = performance.now(); pressX = e.clientX; pressY = e.clientY;
    if(moveMode && selected){
      dragTarget = selected;
      raycaster.setFromCamera(toNDC(e.clientX,e.clientY), camera);
      if(raycaster.ray.intersectPlane(groundPlane, hitPoint)){
        dragOffset.copy(selected.position).sub(hitPoint);
      } else dragOffset.set(0,0,0);
    }
  }
  if(pointers.size === 2){                       // FIX A10: seed ค่าตอนนิ้วที่ 2 ลง
    const p = [...pointers.values()];
    pinchDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1;
    pinchCX = (p[0].x+p[1].x)/2; pinchCY = (p[0].y+p[1].y)/2;
    dragTarget = null;
  }
});

canvasEl.addEventListener('pointermove', e=>{
  const p = pointers.get(e.pointerId);
  if(!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;

  if(pointers.size === 1){
    if(dragTarget){
      raycaster.setFromCamera(toNDC(e.clientX,e.clientY), camera);
      if(raycaster.ray.intersectPlane(groundPlane, hitPoint)){
        dragTarget.position.copy(hitPoint).add(dragOffset);
        if(snapEnabled){
          dragTarget.position.x = Math.round(dragTarget.position.x/0.1)*0.1;
          dragTarget.position.z = Math.round(dragTarget.position.z/0.1)*0.1;
        }
        clampToRoom(dragTarget);
        selBox.setFromObject(dragTarget);
        selHelper.box.copy(selBox);
      }
    } else {
      const [lo,hi] = phiRange();
      orbit.theta -= dx * 0.006;
      orbit.phi = clamp(orbit.phi - dy * 0.006, lo, hi);
    }
    invalidate();
  } else if(pointers.size === 2){
    const p2 = [...pointers.values()];
    const d = Math.hypot(p2[0].x-p2[1].x, p2[0].y-p2[1].y) || 1;
    const cx = (p2[0].x+p2[1].x)/2, cy = (p2[0].y+p2[1].y)/2;

    orbit.r = clamp(orbit.r * (pinchDist/d), viewMode==='walk'?0.2:1.2, 30);

    /* FIX C11: pan เป้ากล้องด้วยสองนิ้ว */
    const pdx = cx - pinchCX, pdy = cy - pinchCY;
    camera.getWorldDirection(fwdVec); fwdVec.y = 0; fwdVec.normalize();
    rightVec.copy(fwdVec).cross(UP).normalize();
    const k = orbit.r * 0.0022;
    orbitTarget.addScaledVector(rightVec, -pdx * k);
    orbitTarget.addScaledVector(fwdVec,    pdy * k);
    orbitTarget.x = clamp(orbitTarget.x, -roomW/2, roomW/2);
    orbitTarget.z = clamp(orbitTarget.z, -roomD/2, roomD/2);

    pinchDist = d; pinchCX = cx; pinchCY = cy;
    invalidate();
  }
});

function onPointerUp(e){
  const moved = Math.hypot(e.clientX - pressX, e.clientY - pressY);
  if(pointers.size === 1 && performance.now() - pressTime < 280 && moved < 10 && !dragTarget){
    selectObject(pickItem(e.clientX, e.clientY));
  }
  if(dragTarget){ resolveOverlap(dragTarget); refreshSelection(); pushUndo(); dragTarget = null; }
  pointers.delete(e.pointerId);
}
canvasEl.addEventListener('pointerup', onPointerUp);
canvasEl.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); dragTarget = null; });
canvasEl.addEventListener('wheel', e=>{
  e.preventDefault();
  orbit.r = clamp(orbit.r * (1 + Math.sign(e.deltaY)*0.09), 0.2, 30);
  invalidate();
}, {passive:false});

/* ══════════ 12. camera modes ══════════ */
let viewMode = '3d';
function applyView(mode){
  viewMode = mode;
  if(mode === 'top'){
    orbit.phi = 0.13; orbit.r = Math.max(roomW, roomD) * 1.45;
    orbitTarget.set(0,0,0); hideWalls = true; camera.fov = 52;
  } else if(mode === 'walk'){
    orbit.phi = Math.PI/2 - 0.02; orbit.r = 0.4;
    orbitTarget.set(0, 1.55, 0); hideWalls = false; camera.fov = 72;
  } else {
    orbit.phi = 1.05; orbit.r = Math.max(roomW, roomD) * 1.7;
    orbitTarget.set(0, 1, 0); hideWalls = false; camera.fov = 52;
  }
  qs('#bWall').classList.toggle('on', hideWalls);
  camera.updateProjectionMatrix();
  invalidate();
}
qs('#seg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));

qs('#bSnap').onclick = e=>{

  e.currentTarget.classList.toggle('on', snapEnabled);
  showToast(snapEnabled ? 'สแนปทุก 10 ซม.' : 'ย้ายอิสระ');
};
qs('#bWall').onclick = e=>{

};
qs('#bUndo').onclick = ()=>{
  if(undoStack.length < 2){ showToast('ไม่มีอะไรให้ย้อน'); return; }
  undoStack.pop();

  showToast('ย้อนกลับแล้ว');
};

qs('#tRotL').onclick = ()=>{ if(selected){ selected.rotation.y += Math.PI/12; clampToRoom(selected); pushUndo(); refreshSelection(); } };

  pushUndo(); selectObject(o); showToast('ทำซ้ำแล้ว');
};
qs('#tDel').onclick  = ()=>{ if(selected){ removeItem(selected); showToast('ลบแล้ว'); } };

const sheetEl = qs('#sheet');
let sheetHeight = 96;
const sheetSnaps = ()=>[96, Math.round(innerHeight*0.45), Math.round(innerHeight*0.82)];
function setSheetHeight(h, animate){
  sheetEl.classList.toggle('drag', animate === false);

  sheetEl.style.height = h + 'px';
  layoutSelBar();
}
qs('#grab').addEventListener('pointerdown', e=>{

    setSheetHeight(near, true);

/* ══════════ 16. GLB loader ══════════ */
const dracoLoader = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader().setDRACOLoader(dracoLoader);
qs('#glbInput').onchange = e=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(file.size > 40*1024*1024){ showToast('ไฟล์ใหญ่เกิน 40 MB'); return; }
  showToast('กำลังโหลด ' + file.name + ' …');
  const fr = new FileReader();
  fr.onload = ()=>{
    gltfLoader.parse(fr.result, '', g=>{
      const obj = g.scene;
      const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
      obj.scale.setScalar(1 / (Math.max(size.x,size.y,size.z) || 1));
      obj.updateMatrixWorld(true);
      const b2 = new THREE.Box3().setFromObject(obj);
      obj.position.y = -b2.min.y;
      obj.traverse(n=>{
        if(n.isMesh){
          n.castShadow = true; n.receiveShadow = true;
          n.userData = {owned:true, ownTextures:true};
          if(n.material) n.material.envMapIntensity = 0.85;
        }
      });
      obj.userData = {kind:'glb', label:file.name, base:localSize(obj)};
      clampToRoom(obj);
      scene.add(obj); items.push(obj);
      selectObject(obj); showToast('เพิ่มโมเดลแล้ว');
    }, ()=>showToast('ไฟล์เสียหายหรือไม่รองรับ (รองรับ .glb เท่านั้น)'));
  };
  fr.onerror = ()=>showToast('อ่านไฟล์ไม่สำเร็จ');
  fr.readAsArrayBuffer(file);
};

/* ══════════ 17. material panel ══════════ */
let currentMatType = 'wood';
function firstStyledMesh(obj){
  let found = null;
  obj.traverse(n=>{ if(!found && n.isMesh && n.userData && n.userData.t) found = n; });
  return found;
}
function refreshMaterialPanel(){
  const mesh = selected ? firstStyledMesh(selected) : null;
  qs('#matEmpty').style.display = mesh ? 'none' : 'block';
  qs('#matUI').hidden = !mesh;
  if(!mesh) return;
  currentMatType = mesh.userData.t;

  const cats = qs('#matCats');
  cats.textContent = '';
  Object.keys(MATS).forEach(type=>{
    const b = document.createElement('button');
    b.className = 'mcat' + (type === currentMatType ? ' on' : '');
    b.textContent = MAT_TH[type];
    b.onclick = ()=>{
      currentMatType = type;
      [...cats.children].forEach(c=>c.classList.toggle('on', c===b));
      renderSwatches();
    };
    cats.appendChild(b);
  });
  renderSwatches();
  qs('#sRough').value = mesh.material.roughness;
  qs('#oRough').textContent = Number(mesh.material.roughness).toFixed(2);
  qs('#sMetal').value = mesh.material.metalness;
  qs('#oMetal').textContent = Number(mesh.material.metalness).toFixed(2);
}
function renderSwatches(){
  const wrap = qs('#matSw');
  wrap.textContent = '';
  const mesh = selected ? firstStyledMesh(selected) : null;
  const curVar = mesh ? mesh.userData.v : null;
  Object.keys(MATS[currentMatType]).forEach(variant=>{
    const hex = MATS[currentMatType][variant];
    const b = document.createElement('button');
    b.className = 'sw' + (variant === curVar ? ' on' : '');
    b.style.background = '#' + hex.toString(16).padStart(6,'0');
    const s = document.createElement('span'); s.textContent = variant;
    b.appendChild(s);
    b.onclick = ()=>applyMaterial(currentMatType, variant);
    wrap.appendChild(b);
  });
}
function applyMaterial(type, variant){
  if(!selected) return;
  selected.traverse(n=>{
    if(!n.isMesh || !n.userData || !n.userData.t) return;
    if(n.userData.t === 'glass') return;                 // ไม่ทับกระจก
    n.material = getMat(type, variant, n.userData.tier || 1);
    n.userData = {t:type, v:variant, tier:n.userData.tier || 1, owned:false};
  });
  pushUndo(); refreshMaterialPanel(); invalidate();
  showToast(MAT_TH[type] + ' · ' + variant);
}
/* clone material ก่อนปรับค่าเฉพาะชิ้น — และ "ไม่" dispose texture ที่แชร์ */
function makeOwnMaterials(obj){
  obj.traverse(n=>{
    if(n.isMesh && n.material && (!n.userData || !n.userData.owned)){
      n.material = n.material.clone();
      n.userData = Object.assign({}, n.userData, {owned:true, ownTextures:false});
    }
  });
}
qs('#sRough').oninput = e=>{
  if(!selected) return;
  makeOwnMaterials(selected);
  const v = +e.target.value;
  selected.traverse(n=>{ if(n.isMesh && n.material && 'roughness' in n.material) n.material.roughness = v; });
  qs('#oRough').textContent = v.toFixed(2);
  invalidate();
};
qs('#sMetal').oninput = e=>{
  if(!selected) return;
  makeOwnMaterials(selected);
  const v = +e.target.value;
  selected.traverse(n=>{ if(n.isMesh && n.material && 'metalness' in n.material) n.material.metalness = v; });
  qs('#oMetal').textContent = v.toFixed(2);
  invalidate();
};

/* ══════════ 18. properties panel ══════════ */
function refreshPropsPanel(){
  qs('#propEmpty').style.display = selected ? 'none' : 'block';
  qs('#propUI').hidden = !selected;
  if(!selected) return;
  const base = selected.userData.base || localSize(selected);
  const sc = selected.scale;
  qs('#propName').textContent = selected.userData.label || 'วัตถุ';
  const set = (sid, oid, val)=>{ qs(sid).value = Math.round(val); qs(oid).textContent = Math.round(val); };
  set('#sW','#oW', base.x*sc.x*100);
  set('#sH','#oH', base.y*sc.y*100);
  set('#sD','#oD', base.z*sc.z*100);
  const deg = (Math.round(THREE.MathUtils.radToDeg(selected.rotation.y)) % 360 + 360) % 360;
  qs('#sR').value = Math.round(deg/5)*5;
  qs('#oR').textContent = deg;
}
function bindDim(sid, oid, axis){
  qs(sid).oninput = e=>{
    if(!selected) return;
    const base = selected.userData.base;
    if(!base || !base[axis]) return;
    selected.scale[axis] = Math.max(0.05, (+e.target.value/100) / base[axis]);
    qs(oid).textContent = Math.round(+e.target.value);
    clampToRoom(selected);
    refreshSelection();
  };
  qs(sid).onchange = ()=>pushUndo();
}
bindDim('#sW','#oW','x');
bindDim('#sH','#oH','y');
bindDim('#sD','#oD','z');
qs('#sR').oninput = e=>{
  if(!selected) return;
  selected.rotation.y = THREE.MathUtils.degToRad(+e.target.value);
  qs('#oR').textContent = e.target.value;
  clampToRoom(selected);
  refreshSelection();
};
qs('#sR').onchange = ()=>pushUndo();
qs('#bWallSnap').onclick = ()=>{
  if(!selected) return;
  const f = footprint(selected), p = selected.position;
  const dl = Math.abs(p.x + roomW/2), dr = Math.abs(roomW/2 - p.x);
  const db = Math.abs(p.z + roomD/2), df = Math.abs(roomD/2 - p.z);
  const m = Math.min(dl,dr,db,df);
  if(m === dl){ selected.rotation.y = Math.PI/2; }
  else if(m === dr){ selected.rotation.y = -Math.PI/2; }
  else if(m === db){ selected.rotation.y = 0; }
  else { selected.rotation.y = Math.PI; }
  const f2 = footprint(selected);
  if(m === dl) p.x = -roomW/2 + f2.x/2;
  else if(m === dr) p.x = roomW/2 - f2.x/2;
  else if(m === db) p.z = -roomD/2 + f2.z/2;
  else p.z = roomD/2 - f2.z/2;
  clampToRoom(selected); pushUndo(); refreshSelection();
  showToast('จัดชิดผนังแล้ว');
};

const THUMB = 320;
const thumbScene = new THREE.Scene();
thumbScene.background = new THREE.Color(0x20242e);
thumbScene.environment = scene.environment;
thumbScene.add(new THREE.AmbientLight(0xffffff, 0.5));
{
  const k = new THREE.DirectionalLight(0xffffff, 1.25); k.position.set(2.4, 3.4, 2.6);
  const f = new THREE.DirectionalLight(0xbcd4ff, 0.42); f.position.set(-2.6, 1.6, -2.2);
  const r = new THREE.DirectionalLight(0xffe6c0, 0.3);  r.position.set(0, 1.2, -3);
  thumbScene.add(k, f, r);
}
const thumbCam = new THREE.PerspectiveCamera(34, 1, 0.02, 60);
const thumbRT = new THREE.WebGLRenderTarget(THUMB, THUMB, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true
});
thumbRT.texture.colorSpace = THREE.SRGBColorSpace;
const thumbPixels = new Uint8Array(THUMB * THUMB * 4);
const thumb2D = document.createElement('canvas');
thumb2D.width = thumb2D.height = THUMB;
const thumbCtx = thumb2D.getContext('2d');
const thumbCache = new Map();

function shRenderThumb(kind, matType, matVar, angle){
  const key = kind + '|' + matType + '|' + matVar + '|' + (angle || 0);
  if(thumbCache.has(key)) return thumbCache.get(key);
  const entry = CATALOG[kind];
  if(!entry) return '';

  const obj = entry.build();
  if(matType){
    obj.traverse(n=>{
      if(n.isMesh && n.userData && n.userData.t && n.userData.t !== 'glass'){
        n.material = getMat(matType, matVar, n.userData.tier || 1);
      }
    });
  }
  thumbScene.add(obj);
  obj.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const ctr  = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.72 + 0.12;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(thumbCam.fov) / 2) * 1.08;
  const th = (angle || 0) * 0.9 + Math.PI * 0.26;
  const ph = 1.06 - (angle === 2 ? 0.42 : 0);
  thumbCam.position.set(
    ctr.x + dist * Math.sin(ph) * Math.sin(th),
    ctr.y + dist * Math.cos(ph),
    ctr.z + dist * Math.sin(ph) * Math.cos(th)
  );
  thumbCam.lookAt(ctr);
  thumbCam.updateProjectionMatrix();

  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(thumbRT);
  renderer.clear();
  renderer.render(thumbScene, thumbCam);
  renderer.readRenderTargetPixels(thumbRT, 0, 0, THUMB, THUMB, thumbPixels);
  renderer.setRenderTarget(prevTarget);

  const img = thumbCtx.createImageData(THUMB, THUMB);
  for(let y = 0; y < THUMB; y++){
    const src = (THUMB - 1 - y) * THUMB * 4, dst = y * THUMB * 4;
    img.data.set(thumbPixels.subarray(src, src + THUMB * 4), dst);
  }
  thumbCtx.putImageData(img, 0, 0);
  const url = thumb2D.toDataURL('image/png');

  thumbScene.remove(obj);
  obj.traverse(n=>{ if(n.isMesh && n.geometry) n.geometry.dispose(); });
  thumbCache.set(key, url);
  invalidate();
  return url;
}

/* คิวสร้างรูปแบบทยอย — ไม่ให้เฟรมกระตุกตอนเปิดหน้าร้าน */
const shThumbQueue = [];
let shQueueRunning = false;
function shQueueThumb(imgEl, kind, mt, mv, angle, photo){
  if(photo){ imgEl.src = photo; imgEl.style.objectFit = 'cover'; return; }
  shThumbQueue.push({imgEl, kind, mt, mv, angle: angle || 0});
  if(shQueueRunning) return;
  shQueueRunning = true;
  const step = ()=>{
    let budget = 2;
    while(budget-- > 0 && shThumbQueue.length){
      const j = shThumbQueue.shift();
      if(!j.imgEl.isConnected) continue;
      j.imgEl.src = shRenderThumb(j.kind, j.mt, j.mv, j.angle);
    }
    if(shThumbQueue.length) requestAnimationFrame(step);
    else shQueueRunning = false;
  };
  requestAnimationFrame(step);
}

const shEsc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shNf = (n,d)=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});

/* ═══════════ 24. SHOP — การคำนวณราคา ═══════════ */
function shCartCalc(){
  let sub = 0, units = 0;
  SH.cart.forEach(c=>{
    const p = shProd(c.id); if(!p) return;
    sub += p.price * c.qty; units += c.qty;
  });
  let disc = 0, shipFree = false;
  const cp = SH.coupon && SH_COUPONS[SH.coupon];
  if(cp && sub >= cp.min){
    if(cp.type === 'pct')  disc = sub * cp.val / 100;
    if(cp.type === 'baht') disc = cp.val;
    if(cp.type === 'ship') shipFree = true;
  }
  const after = Math.max(0, sub - disc);
  const ship = (after >= SH_SHIP_FREE || shipFree || after === 0) ? 0 : SH_SHIP_FEE;
  const net = after + ship;
  const vat = net * SH_VAT / 100;
  return {sub, units, disc, ship, net, vat, total: net + vat, shipFree};
}
function shCartCount(){ return SH.cart.reduce((s,c)=>s+c.qty, 0); }
function shBadges(){
  const c = shCartCount(), f = SH.favs.length;
  const cb = qs('#shCartBadge'), fb = qs('#shFavBadge');
  cb.hidden = !c; cb.textContent = c > 99 ? '99+' : c;
  fb.hidden = !f; fb.textContent = f;
}
function shAddCart(id, qty){
  const p = shProd(id); if(!p) return;
  if(p.stock <= 0){ showToast('สินค้าหมดชั่วคราว'); return; }
  const line = SH.cart.find(c=>c.id===id);
  const want = (line ? line.qty : 0) + (qty||1);
  if(want > p.stock){ showToast('สต็อกเหลือ ' + p.stock + ' ชิ้น'); return; }
  if(line) line.qty = want; else SH.cart.push({id, qty: qty||1});
  shSave(); shBadges(); showToast('เพิ่มลงตะกร้า · ' + p.name);
}
function shToggleFav(id){
  const i = SH.favs.indexOf(id);
  if(i >= 0) SH.favs.splice(i,1); else SH.favs.push(id);
  shSave(); shBadges();
  showToast(i >= 0 ? 'นำออกจากรายการโปรด' : 'เพิ่มในรายการโปรด');
}

/* ═══════════ 25. SHOP — กราฟ canvas เขียนเอง ═══════════ */
const shChart = {
  prep(cv, h){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = cv.clientWidth || 300;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    cv.style.height = h + 'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
    return {c, w, h};
  },
  bar(cv, labels, vals, color){
    const {c,w,h} = this.prep(cv, 170);
    const pad = {l:46, r:8, t:10, b:26};
    const max = Math.max(1, ...vals) * 1.15;
    const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
    c.font = '10px sans-serif';
    for(let i=0;i<=4;i++){
      const y = pad.t + ih - ih*i/4;
      c.strokeStyle = '#272c38'; c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke();
      c.fillStyle = '#8b93a3'; c.textAlign = 'right'; c.fillText(shNf(max*i/4), pad.l-6, y+3);
    }
    const bw = iw/Math.max(1,vals.length);
    vals.forEach((v,i)=>{
      const bh = ih*(v/max), x = pad.l + i*bw + bw*0.2, y = pad.t + ih - bh;
      const g = c.createLinearGradient(0,y,0,pad.t+ih);
      g.addColorStop(0, color||'#5b8cff'); g.addColorStop(1,'rgba(91,140,255,.22)');
      c.fillStyle = g; c.fillRect(x, y, bw*0.6, bh);
      c.fillStyle = '#8b93a3'; c.textAlign = 'center';
      if(i % Math.ceil(vals.length/7) === 0) c.fillText(labels[i], x+bw*0.3, h-8);
    });
  },
  line(cv, labels, vals, color){
    const {c,w,h} = this.prep(cv, 170);
    const pad = {l:52, r:10, t:10, b:26};
    const max = Math.max(1, ...vals) * 1.15;
    const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
    c.font = '10px sans-serif';
    for(let i=0;i<=4;i++){
      const y = pad.t + ih - ih*i/4;
      c.strokeStyle = '#272c38'; c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke();
      c.fillStyle = '#8b93a3'; c.textAlign = 'right'; c.fillText(shNf(max*i/4), pad.l-6, y+3);
    }
    const px = i => pad.l + iw*(vals.length<2 ? 0.5 : i/(vals.length-1));
    const py = v => pad.t + ih - ih*(v/max);
    const g = c.createLinearGradient(0,pad.t,0,pad.t+ih);
    g.addColorStop(0,(color||'#33c98a')+'55'); g.addColorStop(1,'transparent');
    c.beginPath(); c.moveTo(px(0), pad.t+ih);
    vals.forEach((v,i)=>c.lineTo(px(i), py(v)));
    c.lineTo(px(vals.length-1), pad.t+ih); c.closePath(); c.fillStyle = g; c.fill();
    c.beginPath(); vals.forEach((v,i)=> i ? c.lineTo(px(i),py(v)) : c.moveTo(px(i),py(v)));
    c.strokeStyle = color||'#33c98a'; c.lineWidth = 2.2; c.lineJoin = 'round'; c.stroke();
    c.fillStyle = color||'#33c98a';
    vals.forEach((v,i)=>{ c.beginPath(); c.arc(px(i),py(v),2.6,0,7); c.fill(); });
    c.fillStyle = '#8b93a3'; c.textAlign = 'center';
    labels.forEach((L,i)=>{ if(i % Math.ceil(labels.length/6) === 0) c.fillText(L, px(i), h-8); });
  },
  donut(cv, parts){
    const {c,w,h} = this.prep(cv, 170);
    const cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 12, r = R*0.62;
    const tot = parts.reduce((s,p)=>s+p.v, 0) || 1;
    let a = -Math.PI/2;
    parts.forEach(p=>{
      const s = (p.v/tot)*Math.PI*2;
      c.beginPath(); c.arc(cx,cy,R,a,a+s); c.arc(cx,cy,r,a+s,a,true);
      c.closePath(); c.fillStyle = p.c; c.fill(); a += s;
    });
    c.fillStyle = '#eef0f4'; c.textAlign = 'center'; c.font = '700 20px sans-serif';
    c.fillText(Math.round(parts[0].v/tot*100) + '%', cx, cy+4);
    c.fillStyle = '#8b93a3'; c.font = '10px sans-serif'; c.fillText(parts[0].label, cx, cy+19);
  }
};

/* ---------- การ์ดสินค้า ---------- */
function shCard(p){
  const b = document.createElement('button');
  b.className = 'shCard';
  const rel = document.createElement('div'); rel.className = 'shWrapRel';
  const img = document.createElement('img'); img.className = 'shThumb'; img.alt = p.name;
  rel.appendChild(img);
  if(p.tag){
    const t = document.createElement('div');
    t.className = 'shTag ' + p.tag;
    t.textContent = p.tag === 'sale' ? '-' + Math.round((1 - p.price/p.old)*100) + '%'
                  : p.tag === 'new' ? 'ใหม่' : 'ขายดี';
    rel.appendChild(t);
  }
  const fav = document.createElement('div');
  fav.className = 'shFav'; fav.textContent = SH.favs.indexOf(p.id) >= 0 ? '❤️' : '🤍';
  fav.onclick = ev=>{ ev.stopPropagation(); shToggleFav(p.id); shGo(shTab); };
  rel.appendChild(fav);

  const bd = document.createElement('div'); bd.className = 'bd';
  bd.innerHTML =
    '<div class="nm">' + shEsc(p.name) + '</div>' +
    '<div class="mt"><span class="shStars">' + shStars(p.rating) + '</span> ' + p.rating.toFixed(1) +
      ' · ขายแล้ว ' + shNf(p.sold) + '</div>' +
    '<div class="pr">' + shB(p.price) + (p.old ? '<span class="op">' + shB(p.old) + '</span>' : '') + '</div>' +
    (p.stock <= 0 ? '<div class="shOut">สินค้าหมด</div>'
      : p.stock <= 5 ? '<div class="shOut">เหลือ ' + p.stock + ' ชิ้น</div>'
      : '<div class="mt">คงเหลือ ' + shNf(p.stock) + ' ชิ้น</div>');

  b.append(rel, bd);
  b.onclick = ()=>shDetail(p.id);
  shQueueThumb(img, p.kind, p.mt, p.mv, 0, shPhoto(p));
  return b;
}

function shViewStore(){
  shBody.innerHTML =
    '<div class="shTools">' +
      '<input class="shIn" id="shSearch" placeholder="ค้นหาสินค้า / รหัส SKU" value="' + shEsc(shQuery) + '">' +
      '<select class="shIn" id="shSort">' +
        '<option value="pop">ยอดนิยม</option><option value="new">มาใหม่</option>' +
        '<option value="asc">ราคาต่ำ → สูง</option><option value="desc">ราคาสูง → ต่ำ</option>' +
        '<option value="rate">คะแนนรีวิว</option></select>' +
    '</div>' +
    '<div class="shCats" id="shCatRow"></div>' +
    '<div id="shResult"></div>';
  qs('#shSort').value = shSort;

  const row = qs('#shCatRow');
  Object.keys(SH_CATS).forEach(k=>{
    const b = document.createElement('button');
    b.className = shCat === k ? 'on' : '';
    b.textContent = SH_CATS[k];
    b.onclick = ()=>{ shCat = k; shViewStore(); };
    row.appendChild(b);
  });
  const draw = ()=>{
    let list = SH.products.slice();
    if(shCat !== 'all') list = list.filter(p=>p.cat === shCat);
    if(shQuery){
      const q = shQuery.toLowerCase();
      list = list.filter(p=>(p.name + ' ' + p.sku + ' ' + p.desc).toLowerCase().indexOf(q) >= 0);
    }
    const S = {pop:(a,b)=>b.sold-a.sold, new:(a,b)=>b.created-a.created,
               asc:(a,b)=>a.price-b.price, desc:(a,b)=>b.price-a.price, rate:(a,b)=>b.rating-a.rating};
    list.sort(S[shSort]);
    const res = qs('#shResult');
    res.innerHTML = '';
    if(!list.length){ res.innerHTML = '<div class="empty">ไม่พบสินค้าที่ค้นหา</div>'; return; }
    const head = document.createElement('div');
    head.className = 'shSect'; head.textContent = 'พบ ' + list.length + ' รายการ';
    const g = document.createElement('div'); g.className = 'shGrid';
    list.forEach(p=>g.appendChild(shCard(p)));
    res.append(head, g);
  };
  qs('#shSearch').oninput = e=>{ shQuery = e.target.value; draw(); };
  qs('#shSort').onchange  = e=>{ shSort = e.target.value; draw(); };
  draw();
}

        b.className = 'sw' + (v === curVar ? ' on' : '');
        b.style.background = '#' + MATS[p.mt][v].toString(16).padStart(6,'0');
        const s = document.createElement('span'); s.textContent = v; b.appendChild(s);
        b.onclick = ()=>{
          curVar = v; drawVars();
          [...gal.children].forEach((im,a)=>{ im.src = ''; shQueueThumb(im, p.kind, p.mt, curVar, a, shPhoto(p)); });
        };
        vr.appendChild(b);
      });
    };
    drawVars();
    const sync = ()=>{ qs('#shQv').textContent = qty; qs('#shQsum').textContent = shB(p.price*qty); };
    qs('#shQm').onclick = ()=>{ qty = Math.max(1, qty-1); sync(); };
    qs('#shQp').onclick = ()=>{ qty = Math.min(Math.max(1,p.stock), qty+1); sync(); };
    qs('#shBuy').onclick = ()=>{ shAddCart(id, qty); shModalClose(); };
    qs('#shFavD').onclick = ()=>{ shToggleFav(id); shModalClose(); shGo(shTab); };
    qs('#shTry').onclick = ()=>{
      shModalClose();
      qs('#shop').classList.remove('on');
      addItem(p.kind);
      if(selected) applyMaterial(p.mt, curVar);
      showToast('วาง "' + p.name + '" ในห้องแล้ว');
    };
  });
}

    '<div class="shSect">ส่วนลด</div>' +

      '<button class="shBtn sm pri" id="shApply">ใช้โค้ด</button></div>' +

    '<div class="shBox" style="margin-top:12px">' +
      '<div class="shLine"><span>ยอดรวมสินค้า</span><span>' + shB2(t.sub) + '</span></div>' +

      '<div class="shLine sub"><span>ภาษีมูลค่าเพิ่ม ' + SH_VAT + '%</span><span>' + shB2(t.vat) + '</span></div>' +
      '<div class="shLine tot"><span>รวมทั้งสิ้น</span><span>' + shB2(t.total) + '</span></div>' +
      (t.ship ? '<div style="font-size:11px;color:var(--sub);margin-top:8px">ซื้อเพิ่มอีก ' +
        shB(SH_SHIP_FREE - (t.sub - t.disc)) + ' เพื่อรับสิทธิ์ส่งฟรี</div>' : '') +
    '</div>' +
    '<button class="shBtn pri" id="shCheckout">ดำเนินการสั่งซื้อ</button>' +
    '<button class="shBtn dgr" id="shEmpty">ล้างตะกร้า</button>';

  const list = qs('#shCartList');
  SH.cart.forEach(c=>{
    const p = shProd(c.id); if(!p) return;
    const row = document.createElement('div'); row.className = 'shItem';
    const im = document.createElement('img'); im.alt = p.name;
    const info = document.createElement('div'); info.className = 'i';
    info.innerHTML = '<b>' + shEsc(p.name) + '</b><small>' + shEsc(p.sku) + ' · ' + shB(p.price) + ' / ชิ้น</small>';
    const q = document.createElement('div'); q.className = 'shQty';
    const bm = document.createElement('button'); bm.textContent = '−';
    const bv = document.createElement('b'); bv.textContent = c.qty;
    const bp = document.createElement('button'); bp.textContent = '+';
    const sum = document.createElement('span');
    sum.style.cssText = 'margin-left:auto;font-size:12.5px;font-weight:700';
    sum.textContent = shB(p.price * c.qty);
    const del = document.createElement('button'); del.textContent = '🗑'; del.style.color = 'var(--danger)';
    bm.onclick = ()=>{ c.qty = Math.max(1, c.qty-1); shSave(); shViewCart(); shBadges(); };
    bp.onclick = ()=>{ if(c.qty < p.stock){ c.qty++; shSave(); shViewCart(); shBadges(); } else showToast('เกินสต็อก'); };
    del.onclick = ()=>{ SH.cart = SH.cart.filter(x=>x.id !== c.id); shSave(); shViewCart(); shBadges(); };
    q.append(bm, bv, bp, sum, del);
    info.appendChild(q);

function shCheckout(){
  const t = shCartCalc();
  const pf = SH.profile;
  shModal('ยืนยันคำสั่งซื้อ',
    '<div class="shFld"><label>ชื่อผู้รับ</label><input class="shIn" id="ckName" value="' + shEsc(pf.name) + '"></div>' +
    '<div class="shFld"><label>เบอร์โทรศัพท์</label><input class="shIn" id="ckPhone" inputmode="tel" value="' + shEsc(pf.phone) + '"></div>' +
    '<div class="shFld"><label>ที่อยู่จัดส่ง</label><input class="shIn" id="ckAddr" value="' + shEsc(pf.addr) + '"></div>' +
    '<div class="shFld"><label>วิธีชำระเงิน</label><select class="shIn" id="ckPay">' +
      '<option value="transfer">โอนผ่านธนาคาร / พร้อมเพย์</option>' +
      '<option value="cod">เก็บเงินปลายทาง</option>' +
      '<option value="card">บัตรเครดิต / เดบิต</option></select></div>' +
    '<div class="shBox">' +
      '<div class="shLine"><span>สินค้า ' + t.units + ' ชิ้น</span><span>' + shB2(t.sub) + '</span></div>' +
      (t.disc ? '<div class="shLine"><span>ส่วนลด</span><span style="color:#33c98a">-' + shB2(t.disc) + '</span></div>' : '') +
      '<div class="shLine"><span>ค่าจัดส่ง</span><span>' + (t.ship ? shB2(t.ship) : 'ฟรี') + '</span></div>' +
      '<div class="shLine sub"><span>VAT ' + SH_VAT + '%</span><span>' + shB2(t.vat) + '</span></div>' +
      '<div class="shLine tot"><span>ยอดชำระ</span><span>' + shB2(t.total) + '</span></div></div>' +
    '<button class="shBtn pri" id="ckGo">ยืนยันสั่งซื้อ</button>',
  ()=>{
    qs('#ckPay').value = pf.pay || 'transfer';
    qs('#ckGo').onclick = ()=>{
      const name = qs('#ckName').value.trim(), phone = qs('#ckPhone').value.trim(), addr = qs('#ckAddr').value.trim();
      if(!name || !phone || !addr){ showToast('กรอกข้อมูลผู้รับให้ครบ'); return; }
      if(!/^[0-9+\- ]{9,15}$/.test(phone)){ showToast('เบอร์โทรไม่ถูกต้อง'); return; }
      if(!SH.cart.length){ showToast('ตะกร้าว่างเปล่า'); return; }
      for(const c of SH.cart){
        const cp = shProd(c.id);
        if(!cp){ showToast('มีสินค้าในตะกร้าที่ถูกลบออกจากร้านแล้ว'); return; }
        if(c.qty > cp.stock){ showToast('สต็อก "' + cp.name + '" เหลือ ' + cp.stock + ' ชิ้น'); return; }
      }
      SH.profile = {name, phone, addr, pay: qs('#ckPay').value};

      const lines = SH.cart.map(c=>{
        const p = shProd(c.id);
        return {id:c.id, name:p.name, sku:p.sku, kind:p.kind, mt:p.mt, mv:p.mv, price:p.price, qty:c.qty};
      });
      lines.forEach(l=>{
        const p = shProd(l.id);
        if(p){
          p.stock = Math.max(0, p.stock - l.qty);
          p.sold += l.qty;
          if(p.stock <= 5) showToast('⚠ สต็อกต่ำ: ' + p.name + ' เหลือ ' + p.stock);
        }
      });
      const now = Date.now();
      const order = {
        id: shUid('o'),
        code: 'SO-' + new Date(now).toISOString().slice(2,10).replace(/-/g,'') + '-' + String(SH.orders.length+1).padStart(3,'0'),
        items: lines, totals: t, coupon: SH.coupon,
        customer: Object.assign({}, SH.profile),
        status: 'pending', createdAt: now,
        timeline: [{s:'pending', at:now}]
      };
      SH.orders.unshift(order);
      SH.cart = []; SH.coupon = null;
      shSave(); shBadges(); shModalClose(); shGo('orders');
      showToast('สั่งซื้อสำเร็จ · ' + order.code);
    };
  });
}

const SH_ST = {
  pending : {l:'รอชำระเงิน', c:'s-pending',  i:'⏳'},
  paid    : {l:'ชำระแล้ว',   c:'s-paid',     i:'💳'},
  packing : {l:'กำลังแพ็ก',  c:'s-packing',  i:'📦'},

};
const SH_NEXT = {pending:['paid','cancel'], paid:['packing'], packing:['shipping'],
                 shipping:['done'], done:[], cancel:[]};
const shPill = s => '<span class="shPill ' + SH_ST[s].c + '">' + SH_ST[s].i + ' ' + SH_ST[s].l + '</span>';

    '<div class="shBox"><h4>สถานะการจัดส่ง</h4>' +
      o.timeline.slice().reverse().map(t=>

      ).join('') + '</div>' +

    '<button class="shBtn" id="shReorder">🔁 สั่งซ้ำรายการนี้</button>',
  ()=>{
    const acts = qs('#shActs');
    if(acts) nexts.forEach(s=>{
      const b = document.createElement('button');
      b.className = 'shBtn ' + (s === 'done' ? 'ok' : s === 'cancel' ? 'dgr' : 'pri');
      b.textContent = SH_ST[s].i + ' ' + SH_ST[s].l;
      b.onclick = ()=>{
        o.status = s; o.timeline.push({s, at:Date.now()});
        if(s === 'cancel') o.items.forEach(i=>{ const p = shProd(i.id); if(p){ p.stock += i.qty; p.sold -= i.qty; } });
        shSave(); shModalClose(); shGo('orders'); showToast('อัปเดตเป็น ' + SH_ST[s].l);
      };
      acts.appendChild(b);
    });
    qs('#shReorder').onclick = ()=>{
      o.items.forEach(i=>{ const p = shProd(i.id); if(p && p.stock > 0) shAddCart(i.id, Math.min(i.qty, p.stock)); });
      shModalClose(); shGo('cart');
    };
  });
}

function shViewRoom(){

  }
  const rows = keys.map(k=>{
    const match = SH.products.filter(p=>p.kind === k).sort((a,b)=>a.price-b.price)[0];

  }).filter(r=>r.p);

      '<div class="shKpi acc"><div class="l">ขนาดห้อง</div><div class="v">' + area + ' ตร.ม.</div>' +
        '<div class="d">' + roomW.toFixed(1) + ' × ' + roomD.toFixed(1) + ' × ' + roomH.toFixed(2) + ' ม.</div></div>' +
      '<div class="shKpi"><div class="l">เฟอร์นิเจอร์ในห้อง</div><div class="v">' + items.length + '</div>' +
        '<div class="d">' + rows.length + ' ประเภท</div></div>' +
      '<div class="shKpi ok"><div class="l">มูลค่ารวมโดยประมาณ</div><div class="v">' + shB(total) + '</div>' +
        '<div class="d">อ้างอิงรุ่นราคาประหยัดสุด</div></div>' +
    '</div>' +
    '<div class="shSect">รายการที่จัดวางอยู่</div>' +
    '<div class="shTbl"><table><thead><tr><th>สินค้าที่ตรงกับโมเดล</th><th class="n">จำนวน</th>' +
      '<th class="n">ราคา/ชิ้น</th><th class="n">รวม</th></tr></thead><tbody>' +
      rows.map(r=>'<tr><td>' + shEsc(r.p.name) + '<br><span style="color:var(--sub);font-size:10.5px">' +
        shEsc(r.p.sku) + '</span></td><td class="n">' + r.n + '</td><td class="n">' + shB(r.p.price) +
        '</td><td class="n">' + shB(r.p.price*r.n) + '</td></tr>').join('') +
      '<tr><td colspan="3" style="text-align:right;font-weight:700">รวมทั้งหมด</td>' +
      '<td class="n" style="font-weight:700;color:var(--accent)">' + shB(total) + '</td></tr>' +
      '</tbody></table></div>' +
    '<button class="shBtn pri" id="shRoomCart">🛒 เพิ่มทั้งห้องลงตะกร้า</button>' +
    '<button class="shBtn" id="shRoomCsv">⬇ ส่งออกใบเสนอราคา (CSV)</button>';

  qs('#shRoomCart').onclick = ()=>{
    let ok = 0;
    rows.forEach(r=>{ if(r.p.stock > 0){ shAddCart(r.p.id, Math.min(r.n, r.p.stock)); ok++; } });
    if(ok) shGo('cart');
  };
  qs('#shRoomCsv').onclick = ()=>{
    const head = ['SKU','สินค้า','จำนวน','ราคาต่อชิ้น','รวม'];
    const body = rows.map(r=>[r.p.sku, r.p.name, r.n, r.p.price, r.p.price*r.n]);
    body.push(['','รวมทั้งหมด','','', total]);
