    showToast('ส่งออกใบเสนอราคาแล้ว');
  };
}

/* ---------- แดชบอร์ด ---------- */
function shViewDash(){
  const paid = SH.orders.filter(o=>o.status !== 'cancel' && o.status !== 'pending');
  const done = SH.orders.filter(o=>o.status === 'done');
  const rev  = paid.reduce((s,o)=>s + o.totals.total, 0);
  const units= paid.reduce((s,o)=>s + o.items.reduce((a,i)=>a+i.qty,0), 0);
  const aov  = paid.length ? rev/paid.length : 0;
  const low  = SH.products.filter(p=>p.stock <= 5);
  const stockVal = SH.products.reduce((s,p)=>s + p.price*p.stock, 0);

  const labels = [], revV = [], ordV = [];
  for(let i=13;i>=0;i--){
    const k = shDay(Date.now() - i*86400000);
    labels.push(new Date(Date.now()-i*86400000).toLocaleDateString('th-TH',{day:'numeric',month:'short'}));
    const dd = SH.orders.filter(o=>shDay(o.createdAt) === k && o.status !== 'cancel');
    ordV.push(dd.length);
    revV.push(dd.reduce((s,o)=>s + o.totals.total, 0));
  }
  const top = SH.products.slice().sort((a,b)=>b.sold-a.sold).slice(0,6);
  const stCount = {};
  Object.keys(SH_ST).forEach(s=>stCount[s] = SH.orders.filter(o=>o.status===s).length);

  shBody.innerHTML =
    '<div class="shKpis">' +
      '<div class="shKpi acc"><div class="l">รายได้รวม</div><div class="v">' + shB(rev) + '</div>' +
        '<div class="d">จาก ' + paid.length + ' คำสั่งซื้อ</div></div>' +
      '<div class="shKpi"><div class="l">คำสั่งซื้อทั้งหมด</div><div class="v">' + SH.orders.length + '</div>' +
        '<div class="d">สำเร็จ ' + done.length + ' · รอชำระ ' + stCount.pending + '</div></div>' +
      '<div class="shKpi ok"><div class="l">ยอดเฉลี่ย/ออเดอร์</div><div class="v">' + shB(aov) + '</div>' +
        '<div class="d">ขายได้ ' + shNf(units) + ' ชิ้น</div></div>' +
      '<div class="shKpi wn"><div class="l">มูลค่าสต็อกคงเหลือ</div><div class="v">' + shB(stockVal) + '</div>' +
        '<div class="d">' + SH.products.length + ' รายการสินค้า</div></div>' +
      '<div class="shKpi ' + (low.length ? 'dg' : 'ok') + '"><div class="l">สินค้าสต็อกต่ำ</div>' +
        '<div class="v">' + low.length + '</div><div class="d">' + (low.length ? 'ต้องเติมสต็อก' : 'ระดับปกติ') + '</div></div>' +
    '</div>' +
    '<div class="shBox"><h4>📈 รายได้รายวัน (14 วัน)</h4><canvas class="shChart" id="dChart1"></canvas></div>' +
    '<div class="shBox"><h4>🧾 จำนวนคำสั่งซื้อรายวัน</h4><canvas class="shChart" id="dChart2"></canvas></div>' +
    '<div class="shBox"><h4>🎯 สัดส่วนสถานะคำสั่งซื้อ</h4><canvas class="shChart" id="dChart3"></canvas>' +
      '<div class="shLeg">' +
        '<span><i style="background:#33c98a"></i>สำเร็จ ' + stCount.done + '</span>' +
        '<span><i style="background:#5b8cff"></i>กำลังส่ง ' + (stCount.shipping+stCount.packing+stCount.paid) + '</span>' +
        '<span><i style="background:#ffb454"></i>รอชำระ ' + stCount.pending + '</span>' +
        '<span><i style="background:#ff6161"></i>ยกเลิก ' + stCount.cancel + '</span></div></div>' +
    '<div class="shBox"><h4>🏆 สินค้าขายดี</h4><div class="shTbl"><table>' +
      '<thead><tr><th>สินค้า</th><th class="n">ขายแล้ว</th><th class="n">คงเหลือ</th><th class="n">รายได้สะสม</th></tr></thead><tbody>' +
      top.map(p=>'<tr><td>' + shEsc(p.name) + '</td><td class="n">' + shNf(p.sold) + '</td><td class="n"' +
        (p.stock<=5 ? ' style="color:var(--danger);font-weight:700"' : '') + '>' + shNf(p.stock) + '</td>' +
        '<td class="n">' + shB(p.sold*p.price) + '</td></tr>').join('') +
      '</tbody></table></div></div>' +
    (low.length ? '<div class="shBox" style="border-color:#5a2b2b"><h4 style="color:var(--danger)">⚠ แจ้งเตือนสต็อกต่ำ</h4>' +
      '<div class="shTbl"><table><thead><tr><th>สินค้า</th><th class="n">คงเหลือ</th><th class="n">แนะนำเติม</th></tr></thead><tbody>' +
      low.map(p=>'<tr><td>' + shEsc(p.name) + '</td><td class="n" style="color:var(--danger)">' + p.stock +
        '</td><td class="n">' + Math.max(10, 20-p.stock) + '</td></tr>').join('') +
      '</tbody></table></div></div>' : '') +
    '<button class="shBtn" id="shExpOrd">⬇ ส่งออกรายงานคำสั่งซื้อ (CSV)</button>';

  shChart.line(qs('#dChart1'), labels, revV, '#33c98a');
  shChart.bar(qs('#dChart2'), labels, ordV, '#5b8cff');
  shChart.donut(qs('#dChart3'), [
    {label:'สำเร็จ', v:stCount.done, c:'#33c98a'},
    {label:'ดำเนินการ', v:stCount.shipping+stCount.packing+stCount.paid, c:'#5b8cff'},
    {label:'รอชำระ', v:stCount.pending, c:'#ffb454'},
    {label:'ยกเลิก', v:stCount.cancel, c:'#ff6161'}
  ]);
  qs('#shExpOrd').onclick = ()=>{
    const head = ['เลขที่','วันที่','ผู้รับ','โทรศัพท์','จำนวนชิ้น','ยอดสินค้า','ส่วนลด','ค่าส่ง','VAT','รวม','สถานะ'];
    const rows = SH.orders.map(o=>[o.code, shDT(o.createdAt), o.customer.name, o.customer.phone,
      o.items.reduce((s,i)=>s+i.qty,0), o.totals.sub.toFixed(2), o.totals.disc.toFixed(2),
      o.totals.ship.toFixed(2), o.totals.vat.toFixed(2), o.totals.total.toFixed(2), SH_ST[o.status].l]);
    const csv = '\uFEFF' + [head].concat(rows)
      .map(r=>r.map(x=>'"' + String(x).replace(/"/g,'""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'shop-orders-' + shDay(Date.now()) + '.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    showToast('ส่งออกรายงานแล้ว');
  };
}

/* ---------- จัดการสินค้า (CRUD) ---------- */
function shViewAdmin(){
  shBody.innerHTML =
    '<div class="shTools"><input class="shIn" id="adQ" placeholder="ค้นหาสินค้า / SKU">' +
      '<button class="shBtn sm pri" id="adNew">+ เพิ่มสินค้า</button></div>' +
    '<div id="adList"></div>' +
    '<button class="shBtn dgr" id="adReset" style="margin-top:16px">♻️ รีเซ็ตข้อมูลร้านค้าทั้งหมด</button>';
  const draw = ()=>{
    const q = (qs('#adQ').value||'').toLowerCase();
    const list = SH.products.filter(p=>!q || (p.name+' '+p.sku).toLowerCase().indexOf(q) >= 0);
    qs('#adList').innerHTML = list.length ?
      '<div class="shTbl"><table><thead><tr><th>สินค้า</th><th class="n">ราคา</th>' +
      '<th class="n">สต็อก</th><th class="n">จัดการ</th></tr></thead><tbody>' +
      list.map(p=>'<tr><td><b>' + shEsc(p.name) + '</b><br><span style="color:var(--sub);font-size:10.5px">' +
        shEsc(p.sku) + ' · ' + SH_CATS[p.cat] + '</span></td>' +
        '<td class="n">' + shB(p.price) + '</td>' +
        '<td class="n"' + (p.stock<=5 ? ' style="color:var(--danger);font-weight:700"' : '') + '>' + shNf(p.stock) + '</td>' +
        '<td class="n"><button class="shBtn sm" data-ed="' + p.id + '">แก้ไข</button> ' +
        '<button class="shBtn sm dgr" data-dl="' + p.id + '">ลบ</button></td></tr>').join('') +
      '</tbody></table></div>' : '<div class="empty">ไม่พบสินค้า</div>';
    qs('#adList').querySelectorAll('[data-ed]').forEach(b=>b.onclick = ()=>form(shProd(b.dataset.ed)));
    qs('#adList').querySelectorAll('[data-dl]').forEach(b=>b.onclick = ()=>{
      const p = shProd(b.dataset.dl);
      if(SH.orders.some(o=>o.items.some(i=>i.id === p.id))){ showToast('ลบไม่ได้ — มีคำสั่งซื้ออ้างอิงสินค้านี้'); return; }
      if(!confirm('ลบ "' + p.name + '" ?')) return;
      SH.products = SH.products.filter(x=>x.id !== p.id);
      SH.cart = SH.cart.filter(c=>c.id !== p.id);
      SH.favs = SH.favs.filter(f=>f !== p.id);
      shSave(); draw(); shBadges(); showToast('ลบสินค้าแล้ว');
    });
  };
  function form(rec){
    const isNew = !rec;
    const r = rec || {kind:'chair', cat:'seat', mt:'wood', mv:'oak', price:1000, old:0,
                      stock:10, rating:4.5, sold:0, name:'', sku:'', desc:'', dim:'', tag:'', photo:''};
    let photo = shPhoto(r);
    shModal(isNew ? 'เพิ่มสินค้าใหม่' : 'แก้ไข ' + shEsc(r.name),
      '<div class="shFld"><label>ชื่อสินค้า</label><input class="shIn" id="fN" value="' + shEsc(r.name) + '"></div>' +
      '<div class="shFld"><label>รหัส SKU</label><input class="shIn" id="fS" value="' + shEsc(r.sku) + '"></div>' +
      '<div class="shFld"><label>รูปสินค้าจริง (ถ้าไม่ใส่ จะใช้ภาพจากโมเดล 3D)</label>' +
        '<img id="fPV" alt="" style="display:none;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px">' +
        '<input class="shIn" id="fPF" type="file" accept="image/*">' +
        '<button class="shBtn sm dgr" id="fPX" style="margin-top:8px">ลบรูป</button></div>' +
      '<div class="shFld"><label>โมเดล 3D ที่ใช้</label><select class="shIn" id="fK">' +
        Object.keys(CATALOG).map(k=>'<option value="' + k + '"' + (k===r.kind?' selected':'') + '>' +
          CATALOG[k].icon + ' ' + CATALOG[k].label + '</option>').join('') + '</select></div>' +
      '<div class="shFld"><label>หมวดหมู่</label><select class="shIn" id="fC">' +
        Object.keys(SH_CATS).filter(c=>c!=='all').map(c=>'<option value="' + c + '"' +
          (c===r.cat?' selected':'') + '>' + SH_CATS[c] + '</option>').join('') + '</select></div>' +
      '<div class="shRow2">' +
        '<div class="shFld"><label>วัสดุ</label><select class="shIn" id="fMT">' +
          Object.keys(MATS).map(m=>'<option value="' + m + '"' + (m===r.mt?' selected':'') + '>' + MAT_TH[m] + '</option>').join('') + '</select></div>' +
        '<div class="shFld"><label>เฉดสี</label><select class="shIn" id="fMV"></select></div></div>' +
      '<div class="shRow2">' +
        '<div class="shFld"><label>ราคาขาย</label><input class="shIn" id="fP" type="number" min="0" value="' + r.price + '"></div>' +
        '<div class="shFld"><label>ราคาก่อนลด (0=ไม่มี)</label><input class="shIn" id="fO" type="number" min="0" value="' + (r.old||0) + '"></div></div>' +
      '<div class="shRow2">' +
        '<div class="shFld"><label>สต็อก</label><input class="shIn" id="fST" type="number" min="0" value="' + r.stock + '"></div>' +
        '<div class="shFld"><label>คะแนนรีวิว</label><input class="shIn" id="fR" type="number" min="0" max="5" step="0.1" value="' + r.rating + '"></div></div>' +
      '<div class="shFld"><label>ขนาดสินค้า</label><input class="shIn" id="fD" value="' + shEsc(r.dim) + '"></div>' +
      '<div class="shFld"><label>คำอธิบาย</label><input class="shIn" id="fDS" value="' + shEsc(r.desc) + '"></div>' +
      '<div class="shFld"><label>ป้ายกำกับ</label><select class="shIn" id="fT">' +
        [['','ไม่มี'],['sale','ลดราคา'],['new','สินค้าใหม่'],['hot','ขายดี']]
          .map(t=>'<option value="' + t[0] + '"' + (t[0]===r.tag?' selected':'') + '>' + t[1] + '</option>').join('') + '</select></div>' +
      '<button class="shBtn pri" id="fSave">บันทึก</button>',
    ()=>{
      const fillVars = ()=>{
        const mt = qs('#fMT').value;
        qs('#fMV').innerHTML = Object.keys(MATS[mt]).map(v=>'<option value="' + v + '"' +
          (v===r.mv?' selected':'') + '>' + v + '</option>').join('');
      };
      qs('#fMT').onchange = fillVars; fillVars();
      const showPh = ()=>{
        const v = qs('#fPV'); v.style.display = photo ? 'block' : 'none'; if(photo) v.src = photo;
        qs('#fPX').style.display = photo ? 'inline-flex' : 'none';
      };
      showPh();
      qs('#fPX').onclick = ()=>{ photo = ''; qs('#fPF').value = ''; showPh(); };
      qs('#fPF').onchange = ev=>{
        const f = ev.target.files && ev.target.files[0]; if(!f) return;
        const im = new Image(), u = URL.createObjectURL(f);
        im.onload = ()=>{
          const k = Math.min(1, 800 / Math.max(im.width, im.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          photo = cv.toDataURL('image/jpeg', 0.82); URL.revokeObjectURL(u); showPh();
        };
        im.onerror = ()=>{ URL.revokeObjectURL(u); showToast('เปิดไฟล์รูปนี้ไม่ได้'); };
        im.src = u;
      };
      qs('#fSave').onclick = ()=>{
        const name = qs('#fN').value.trim(), sku = qs('#fS').value.trim();
        if(!name || !sku){ showToast('กรอกชื่อสินค้าและ SKU'); return; }
        const price = Math.max(0, +qs('#fP').value || 0);
        if(!price){ showToast('ราคาต้องมากกว่า 0'); return; }
        const obj = rec || {id: shUid('p'), created: Date.now(), sold:0};
        Object.assign(obj, {
          name, sku, kind: qs('#fK').value, cat: qs('#fC').value,
          mt: qs('#fMT').value, mv: qs('#fMV').value,
          price, old: Math.max(0, +qs('#fO').value || 0),
          stock: Math.max(0, +qs('#fST').value || 0),
          rating: clamp(+qs('#fR').value || 4, 0, 5),
          dim: qs('#fD').value.trim(), desc: qs('#fDS').value.trim(), tag: qs('#fT').value, photo
        });
        if(isNew) SH.products.push(obj);
        shSave(); shModalClose(); draw(); showToast('บันทึกสินค้าแล้ว');
      };
    });
  }
  qs('#adQ').oninput = draw;
  qs('#adNew').onclick = ()=>form(null);
  qs('#adReset').onclick = ()=>{
    if(!confirm('ลบข้อมูลร้านค้าทั้งหมดและสร้างใหม่?')) return;
    SH = shSeed(); shSave(); shBadges(); shGo('store'); showToast('รีเซ็ตข้อมูลร้านค้าแล้ว');
  };
  draw();
}

shBadges();
</script>
</body>
</html>
